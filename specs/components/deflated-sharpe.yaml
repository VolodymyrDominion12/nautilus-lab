# =============================================================================
#  deflated-sharpe — Sharpe, зменшений на кількість перевірених конфігурацій
# =============================================================================
#  Компонент, а не робот. Джерело ідеї — «ML Ансамблі У Криптотрейдингу.md»
#  §5.2 (DSR поруч із PBO). Документ називає метрику, але не дає формули, тому
#  реалізація — стандартна (Bailey & López de Prado, «The Deflated Sharpe
#  Ratio», 2014) і позначена як така, щоб її не прийняли за цитату.
#
#  PBO відповідає на питання «чи відтворюється порядок конфігурацій», DSR — на
#  інше: «чи витримає переможець порівняння з найкращим із N випадкових
#  спроб». Це дві різні хвороби вибору параметрів, і лікуються вони різними
#  числами.
# =============================================================================
kind: component
name: deflated-sharpe
version: "1.0"
status: partial
title: "DSR: чи переможець сітки кращий за найкращого з N випадкових прогонів"

hypothesis: >
  Коефіцієнт Шарпа переможця сітки виглядає тим краще, чим більше конфігурацій
  перебрано, — навіть коли перебирається чистий шум. DSR зсуває планку: він
  рахує ймовірність того, що спостережений Sharpe перевищив би очікуваний
  максимум N незалежних прогонів, і додатково поправляє на ненормальність
  розподілу (асиметрію та ексцес). Тоді «Sharpe = 1.1» перестає бути аргументом
  без вказівки, скільки конфігурацій було перевірено заради цього числа.

invariants:
  no_lookahead: true
  decimal_not_float: true
  undefined_beats_guessing: true

invariants_enforced:
  - statement: >
      Планка дефляції зростає з кількістю перевірених конфігурацій, а сама
      ймовірність — не зростає: той самий рядок доходностей після 100 спроб
      отримує не вищу оцінку, ніж після 2. Інакше метрика винагороджувала б
      саме за перебір, проти якого вона й існує.
    enforced_by: src/nautilus_lab/domain/deflated_sharpe.py
    verified_by: tests/unit/test_deflated_sharpe.py::test_more_trials_never_raise_the_deflated_probability

  - statement: >
      Ненормальність розподілу враховується в обидві сторони: від'ємна
      асиметрія (звичайна для трендових стратегій) знижує оцінку за того самого
      Sharpe, а розкид Sharpe між конфігураціями її теж знижує — обидва ефекти
      піняться окремими тестами.
    enforced_by: src/nautilus_lab/domain/deflated_sharpe.py
    verified_by: tests/unit/test_deflated_sharpe.py::test_negative_skew_lowers_the_score

  - statement: >
      Замало даних — це «undefined», а не число: менше 8 спостережень (асиметрія
      й ексцес на такій вибірці — шум), менше 2 конфігурацій, нульова дисперсія
      або недодатний знаменник PSR дають probability=None із причиною в
      summary_line(), а не впевнену цифру.
    enforced_by: src/nautilus_lab/domain/deflated_sharpe.py
    verified_by: tests/unit/test_deflated_sharpe.py::test_undefined_when_there_is_nothing_to_deflate
    note: >
      Окремо піниться, що PSR при нульовому Sharpe дорівнює 0.5 —
      test_zero_sharpe_gives_a_coin_flip, — бо саме це число легко видати за
      «майже значуще», якщо формула порахує його з помилкою.

  - statement: >
      В аудиті перенавчання DSR рахується на тій самій матриці, що й PBO:
      спостереження — блоки доходностей конфігурації-переможця, кількість спроб —
      кількість конфігурацій сітки, розкид Sharpe — по конфігураціях. Другої
      матриці не існує, тож PBO і DSR неможливо порахувати на різних даних.
    enforced_by: src/nautilus_lab/application/run_overfitting_audit.py
    verified_by: tests/unit/test_deflated_sharpe.py::test_audit_scores_report_a_winner_that_generalises

notes: >
  Що є: domain/deflated_sharpe.py (покритий тестами щільно), провід у
  RunOverfitAudit (OverfitAuditReport.deflated_sharpe) і рядок у виводі
  `lab research --pbo` поряд із PBO.

  Чому status: partial, а не active. По-перше, CLI-шлях цілком (`lab research
  --robot regime --pbo`) тестом не покритий — як і весь application-шар аудиту
  (див. specs/components/overfitting-audit.yaml); покритий лише чистий перехід
  «матриця блоків → DSR». По-друге, у PBO-режимі спільно з DSR є відома
  прогалина: --optuna/--trials там тихо ігноруються, тож кількість спроб у DSR
  завжди дорівнює розміру СІТКИ. Для optuna-прогону це заниження спроб і,
  отже, завищення оцінки. Поки це не полагоджено, число з --optuna читати як
  DSR «сітки, що випадково збігається з сіткою».

  Головне обмеження, яке треба читати вголос: спостережень рівно стільки,
  скільки блоків (--pbo-blocks, типово 8). Вісім точок — це мінімум, за якого
  асиметрія й ексцес узагалі щось означають, а не оцінка з малою похибкою.
  Саме тому DSR друкується з observations=<blocks> і trials=<configurations>, а
  не як самотнє число: читач мусить бачити, на чому воно стоїть. Хто хоче
  серйозніший DSR — бере --pbo-blocks 32 і платить за це часом прогону.

  Що DSR не робить: не сертифікує прибутковість і не замінює порівняння з
  buy&hold. Високий DSR означає лише, що спостережений Sharpe важко пояснити
  самим перебором конфігурацій; стратегія, яка програє buy&hold, лишається
  такою і з DSR = 1.

references:
  - ML Ансамблі У Криптотрейдингу.md
  - docs/17-ml-ansambli-vidpovidnist.md
  - specs/components/overfitting-audit.yaml
