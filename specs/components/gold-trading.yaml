      `-PERP` на `wss://fstream.binance.com/ws` у `binance_ws.py`, `market_feed.py`,
      `paper_streamer.py`; `METAL_BASES` і `metal_symbols` у `domain/universe.py`;
      золоті стрес-слайси у `domain/stress_slices.py`; динамічне визначення
      каденції фандингу в `backtest_runner.py`.
    - Фаза G2 (РЕАЛІЗОВАНО повністю — сесії DST, ORB, Kalman pairs, meta_label контекст):
      - Чистий доменний модуль `domain/sessions.py` (IANA `zoneinfo` `Europe/London` /
        `America/New_York`, `tests/unit/test_sessions.py`).
      - Робот `gold_session_orb` (`specs/strategies/gold_session_orb.yaml`,
        `domain/gold_session_orb.py`, `tests/unit/test_gold_session_orb.py`,
        `tests/integration/test_gold_session_orb_backtest.py`), підключений до
        `research`, walk-forward, `param_grid`, Optuna, `paper` та live paper.
      - Апгрейд `pairs` з причинним 2-становим фільтром Калмана (`domain/pairs/kalman.py`,
        `PAIRS_HEDGE_ESTIMATOR=ols|kalman`, `PAIRS_KALMAN_DELTA`,
        `tests/unit/test_pairs_kalman.py`, `tests/integration/test_pairs_kalman_backtest.py`).
      - Контекстні ознаки `premium_index` та IANA DST-сесій у `meta_label`
        (`MetaContextExtractor` у `domain/meta_label_strategy.py`, `OhlcvBar.premium_index_close`,
        `ResearchBarFeed` join, `META_LABEL_CONTEXT_FEATURES=false|true`, `--context-features` у
        `lab ml train` / `scripts/train_meta_label.py`, `tests/unit/test_meta_label.py`,
        `tests/integration/test_meta_label_context_backtest.py`).
    - Фаза G3 (Трек B — COMEX `GC`/`MGC`/`1OZ` через Databento): РЕАЛІЗОВАНО повністю:
      - `domain/calendar.py` (`TradingCalendar`: `CRYPTO_24_7`, `CME_GLOBEX_23_5`, `CME_1OZ_24_7`)
        та календарно-свідомі `domain/data_quality.py` (`check_bars` + `roll_timestamps`) і
        `domain/metrics.py` (`periods_per_year`, ~5796 1h/yr для 23×5), `tests/unit/test_data_quality.py`.
      - `FuturesContract` (`GC`/`MGC`/`1OZ` `.XCEC` та `.v.0.GLBX`), `USD`-рахунок, `multiplier`-свідомі
        `size_position`/`size_spread`/`OpenLot` і `PerContractFeeModel` (`COMEX_MGC_IBKR`,
        `COMEX_GC_IBKR`, `COMEX_1OZ_IBKR`, `COMEX_STRESS_X2`) у `fees.py`, `marking.py`, `risk.py`,
        `instrument.py`, `signal_strategy.py`, `spread_strategy.py`, `backtest_runner.py`,
        `settings.py`, `settings_schema.py`, `tests/integration/test_gold_futures_backtest.py`.
      - `infrastructure/databento_feed.py` (`DatabentoDataLoader` із `bars_timestamp_on_close=True`,
        `JsonRollStore`, `download_databento_dbn`), `composition.ingest_databento`, CLI `lab ingest-databento`,
        опційна екстра `databento` у `pyproject.toml`, `tests/unit/test_databento_feed.py`.

  Пріоритетні алгоритми для тестування на золоті (деталі й джерела 2025–2026 у
  docs/38-gold-trading-spec-2026.md §4):
    1. Forecast-to-Fill Trend + Volatility-Targeted Momentum (база: існуючий
       `regime` + `use_vol_scaling` + `use_chandelier_stop` + `GlobalTrendGate` +
       `REGIME_RANGE_ALLOW_SHORT=false` на `PAXGUSDT-PERP` 1h/4h і потім COMEX `MGC`).
    2. Regime-Filtered Session Breakout (`gold_session_orb`, реалізовано у Фазі G2).
    3. Gold–Silver Dynamic StatArb (`pairs` на `XAUUSDT-PERP`–`XAGUSDT-PERP` або
       COMEX `GC`/`SI` з апгрейдом OLS → Kalman Filter hedge ratio).
    4. Cross-Asset Meta-Labeling (`meta_label` із ознаками базису/преміуму та
       крос-активів `XAG`, `BTC`, `VIX`/`DXY`).
    5. Spot–Perp Basis / Carry (`funding` на `PAXG/USDT` ↔ `PAXGUSDT-PERP`
       після закриття прогалин (a)–(b) у `specs/components/derivatives-data.yaml`).

  Невідпрацьовані гіпотези, які свідомо відхилено ще до коду:
    - Наївний інтрадей OHLCV mean-reversion/скальпінг 1m–15m ($H ≈ 0.5$, не
      переживає комісії/спред).
    - Нефільтровані London / NY ORB (від'ємне нетто-очікування −0.04R за 2021–2026).
    - Фіксовані доларові/піпсові стопи (ламаються при зміні ціни золота з $2000
      до $5600 і $3600).
    - LLM на гарячому шляху виконання.

