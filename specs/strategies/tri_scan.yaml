# =============================================================================
#  tri_scan — пошук циклів трикутного арбітражу (сканер, не робот)
# =============================================================================
#  Статус blocked, і тут це видно найгостріше: доменний модуль — це не клас, а
#  ЧИСТІ ФУНКЦІЇ. Класу-робота не існує взагалі, тому strategy_class у спеці
#  свідомо відсутній: адаптерові нема чого інстанціювати.
#      .venv/bin/lab scan --triangular → triangular_opportunities=0, код 0
#      .venv/bin/lab research --robot tri_scan --synthetic --bars 200 → код 1
# =============================================================================
kind: strategy
name: tri_scan
version: "1.0"
status: blocked
title: "Трикутний арбітраж: пошук циклів від'ємної ваги (Беллман-Форд)"

hypothesis: >
  Якщо обміняти валюту по колу трьох пар, добуток курсів, помножених на
  `(1 − fee)` для кожного ребра, може перевищити одиницю — і тоді оберт дає
  прибуток без напрямкової ставки. Модуль кодує це як граф: вага ребра
  `−ln(rate·(1 − fee))`, і арбітраж існує тоді й лише тоді, коли в графі є цикл
  від'ємної ваги. Пошук — Беллман-Форд із відновленням циклу. Тобто гіпотеза
  стверджує: на реальних котируваннях такі цикли виникають частіше, ніж
  зникають, і прибуток у них перевищує три комісії та прослизання на доступній
  глибині. У коді перевірена лише перша половина — комісії.

blocked_reason: >
  (1) Класу-робота не існує. `domain/triangular_arb.py` містить дата-класи
  `FxEdge` і `TriangularOpportunity` та чисту функцію
  `find_negative_cycles(edges: tuple[FxEdge, ...]) -> list[TriangularOpportunity]`
  (плюс приватний `_reconstruct_cycle`); `application/scan_triangular.py` — це
  19-рядкова обгортка `scan_triangular_opportunities(rates, *, fee)`. Жодного
  об'єкта з `on_bar`/`on_book` немає, а протокол адаптера
  (`SignalRobotConfig`/`SingleLegRobot` у `signal_strategy.py`) вимагає саме
  `on_bar(bar) -> Signal | None`. Тому в спеці немає `strategy_class` — не тому,
  що його забули, а тому, що його немає в коді.
  (2) Немає даних. `lab scan --triangular` бере курси, зашиті в
  `interfaces/cli.py::_run_scan()` (USDT/BTC 0.000015, BTC/ETH 15, ETH/USDT 3500);
  перевірено запуском — виходить `triangular_opportunities=0`, код 0, тобто
  демонстрація, а не сигнал. У каталозі є лише дві bar-серії — ETHUSDT.SIM і
  BTCUSDT.SIM (1-HOUR), — тож кросу ETH/BTC там немає; фіду котирувань трьох ніг
  немає; книги ордерів немає зовсім (див. spec `ml_obi`).
  (3) Немає перевірки глибини й прослизання. Комісія врахована на кожному ребрі
  (`rate·(1 − fee)`), а обсяг — ні: модель неявно припускає, що весь потрібний
  обсяг виконається за цим курсом. docs/05 §5.4 і docs/08 §5.2 фіксують, що
  реальність арбітражу вирішує саме глибина книги; у рушія ж лише барова модель
  виконання (`bar_execution=True`, `FillModel`).
  (4) Немає виконання трьох ніг. Спредовий адаптер двоногий
  (`spread_strategy.py`), атомарного виконання циклу немає, як і обробки
  часткових філів чи незакритої ноги. Арбітраж, про який говорить гіпотеза,
  триває секунди-мілісекунди, тоді як весь цикл дослідження — баровий; на
  1-годинних барах каталогу такий «робот» торгував би на даних, де можливості
  вже давно немає.
  (5) Сітка. У `application/param_grid.py` гілки для `tri_scan` немає, тож якщо
  робота підключати без власної гілки, він тихо підбере сітку `regime`
  (`donchian_period` × `bb_k`) — параметри чужої стратегії.

edge_conditions:
  - name: cycle_survives_three_fees_and_available_depth
    description: >
      Щоб цикл був реальним, `profit_log > 0` мусить зберігатися після комісії на
      кожному з трьох ребер (у коді це є) **і** після прослизання на обсязі, який
      справді стоїть у книзі (у коді цього немає). `profit_log` — це `−Σ вага`,
      тобто логарифм добутку курсів після комісій, тож знак читається однозначно:
      додатний — арбітраж, від'ємний — його немає.

implementation:
  domain_module: src/nautilus_lab/domain/triangular_arb.py
  backtest_adapter: none
  wired_in_backtest: false
  grid_source: default_branch

invariants:
  no_lookahead: true
  closed_bars_only: true
  decimal_not_float: true
  # Робот без адаптера зобов'язаний падати — саме це й робить
  # require_backtest_support() для tri_scan.
  fail_closed_without_adapter: true

evidence:
  measured: false
  beats_buy_hold: null
  notes: >
    Виміру немає: робот не входить до BACKTEST_WIRED_ROBOTS, класу-робота не
    існує, а єдиний запуск сканера — демонстраційні курси, зашиті в CLI, які
    дають нуль можливостей. Приклади в docs/09 §7 відтворюють цю саму функцію на
    **вигаданих** курсах (там же сказано «занадто добре, щоб бути правдою»), тому
    вони не можуть бути доказом переваги й сюди не переносяться.

notes: >
  Це найчесніший випадок серед чотирьох: у домені немає не те що адаптера — немає
  й класу. `domain/triangular_arb.py` — це функції й дата-класи, і саме тому
  `strategy_class` у спеці відсутній (валідатор для `backtest_adapter: none`
  дозволяє його не вказувати, а вказувати вигадане ім'я було б брехнею).
  Дві поведінкові деталі з коду, які варто знати, перш ніж щось із цим робити:
  сканер повертає **той самий цикл кілька разів** — окремий запис на кожну
  вершину-старт (зовнішній цикл `for start in nodes` у `find_negative_cycles`),
  дедуплікації немає, і це задокументовано в docs/15 як свідоме рішення, а не
  баг; комісія стягується на **кожному** ребрі, тобто тричі на цикл.
  Другорядний модуль — `application/scan_triangular.py` (обгортка, яку викликає
  CLI); саме він, а не домен, задає типову комісію `Decimal("0.001")`, бо
  `cli.py::_run_scan()` викликає його без аргументу `fee`.
  `params` у спеці немає свідомо: жодного поля `Settings` цей модуль не читає
  (`taker_fee`/`maker_fee` існують у `Settings`, але сканер бере комісію
  аргументом із типовим значенням, тож зв'язку «env → поведінка» тут немає).
  `minimum_bars` не вказано: гілки в `minimum_bars()` немає (код повернув би
  типове 50), але сканер не споживає бари — він приймає словник курсів.
  `grid_source: default_branch` — гілки в `application/param_grid.py` немає, і
  для робота-сканера сітка `regime` була б безглуздою.

