# =============================================================================
#  dashboard-api — контракт між FastAPI-шаром і веб-дашбордом
# =============================================================================
#  Компонентна спека: механізм наскрізний, не робот. Дашборд — це пульт, який
#  показує числа й запускає прогони; його небезпека не в тому, що він зламається,
#  а в тому, що він тихо покаже або дозволить щось інше, ніж зробив рушій.
#  Тому кожен інваріант тут — про розбіжність між тим, що UI обіцяє, і тим, що
#  код робить, і кожен має пару (enforced_by — модуль, verified_by — тест).
# =============================================================================
kind: component
name: dashboard-api
version: "1.0"
status: active
title: "Веб-дашборд ↔ FastAPI: повага до fail-closed і до відсутніх даних"

hypothesis: >
  Дашборд не має власних даних: він читає те, що повертає FastAPI, і запускає ті
  самі use cases, що й CLI. Отже, будь-яка його обіцянка — це обіцянка API. Якщо
  кожна нова можливість CLI потрапляє в API разом із воротами fail closed, а UI
  показує відсутню серію як відсутню, то «прогін завершився» не почне виглядати
  як «дані під фільтром існували» — і кнопка не запустить те, що бекенд однаково
  відхилить.

invariants:
  fail_closed_before_launch: true
  missing_series_is_reported_not_read_as_empty: true
  ui_flags_exist_in_cli: true

invariants_enforced:
  - statement: >
      Фільтри рівня тіків (`--tick-vpin`, `--hawkes`) відхиляються до запуску
      процесу, якщо робот їх не читає: вони є аргументами конструктора
      RegimeRouter, тож на роботі без нього прапорець приймається й ігнорується —
      прогін був би підписаний «tick VPIN», а кожне рішення ухвалювалося б на
      барному проксі.
    enforced_by: src/nautilus_lab/api/app.py
    verified_by: tests/unit/test_api_data_series.py::test_tick_filter_is_refused_for_a_robot_that_never_reads_ticks
    note: >
      Другий бік того ж інваріанта закриває
      tests/unit/test_api_data_series.py::test_hawkes_filter_is_refused_for_a_robot_without_a_regime_router,
      а перелік здатних роботів — не локальна константа UI, а domain-множини
      TICK_VPIN_ROBOTS / HAWKES_ROBOTS, які `/api/status` віддає фронтенду
      (test_status_reports_which_robots_read_ticks). Спільне джерело правди тут
      принципове: список, продубльований у TypeScript, розійшовся б із кодом
      рівно тоді, коли з'явився б новий робот із RegimeRouter.

  - statement: >
      Прогін із tick-фільтром відхиляється, коли в каталозі немає серії
      aggTrades: рушій читає відсутню серію тіків як порожню, тож фільтр
      працював би на значеннях за замовчуванням і не впав би.
    enforced_by: src/nautilus_lab/api/app.py
    verified_by: tests/unit/test_api_data_series.py::test_tick_filter_is_refused_when_the_catalog_has_no_tick_series
    note: >
      Той самий корінь має `_TickFeedAdapter.load` у composition.py, який повертає
      `[]` і для символу без серії, і для інструмента, з якого символ не
      виводиться. Тест стверджує, що відмова називає символ і команду
      `lab ingest --trades`, тобто що користувач бачить шлях до виправлення, а не
      лише «заборонено». На синтетичних барах тіків немає взагалі —
      test_tick_filter_is_refused_on_synthetic_bars.

  - statement: >
      `/api/data` повертає наявність КОЖНОЇ серії (бари, taker-flow, тіки,
      L2-глибина, фандинг) окремим полем, а не мовчанням: порожня опційна серія
      не приховується.
    enforced_by: src/nautilus_lab/api/data_health.py
    verified_by: tests/unit/test_api_data_series.py::test_data_health_lists_every_series_tree
    note: >
      Сенс у тому, що «прогін завершився» не є доказом існування даних під
      фільтром. Панель Command Center і таблиця каталогу показують `missing`
      явно, і саме тому форма дослідження може блокувати tick-фільтр. Чого тест
      не перевіряє: свіжість серії (що останній тік не на пів року старіший за
      бари) — покриття дає лише добову межу, і жоден інваріант не змушує
      дослідника на неї дивитися.

  - statement: >
      Кожен вид ingest з дашборда відповідає реальному прапорцю CLI, а
      несумісні комбінації (інкрементальність не для бар-серії, кілька символів
      або вікно `start/end` для живої L2-зйомки) відхиляються з поясненням.
    enforced_by: src/nautilus_lab/api/app.py
    verified_by: tests/unit/test_api_data_series.py::test_every_ingest_kind_maps_to_a_real_cli_flag
    note: >
      Друга половина — test_ingest_rejects_incremental_outside_the_bar_series і
      test_depth_ingest_takes_one_symbol_and_no_window. `--depth` тут окремий
      випадок: це блокуюча зйомка через WebSocket, а не бекфіл обмеженого вікна,
      тому `start/end` для неї не мають сенсу, а CLI мовчки взяв би лише перший
      символ — тобто зйомка виглядала б двосимвольною, записавши один.

  - statement: >
      Кнопка «Copy CLI» збирає команду лише з прапорців, які існують у
      `interfaces/cli.py`, а інструмент передає змінною `INSTRUMENT_ID`.
    enforced_by: frontend/src/lib/research.ts
    verified_by: frontend/src/lib/research-logic.test.ts
    note: >
      Попередня версія складала рядок вручну й писала `--instrument` та
      `--stress-slice` — обидва прапорці не існують (`--slice` замість другого,
      окремого прапорця для інструмента немає взагалі), тож «відтвори це в
      терміналі» давало помилку використання замість прогону. Перевірка живе в
      `npm test` / `npm run check:logic` (`src/lib/research-logic.test.ts`).

  - statement: >
      Стрес-слайс відхиляється, якщо його вікно не перетинається з тим, що тримає
      каталог: слайс не звужує вікно завантаження, а замінює його, тож слайс поза
      історією читає нуль барів і валить прогін після повного запуску процесу.
    enforced_by: src/nautilus_lab/domain/stress_slices.py
    verified_by: tests/unit/test_api_data_series.py::test_status_reports_stress_slice_windows
    note: >
      Дати кожного слайса їдуть у фронтенд із `/api/status`, а не живуть другим
      списком у TypeScript: перейменований або перенесений слайс інакше лишався б
      у випадаючому списку зі старим підписом. Сама перевірка перекриття —
      `sliceOverlapsCatalog` + правило в `preflight()` — закрита
      frontend/src/lib/research-logic.test.ts (розділ «a stress slice must lie
      inside the catalog it runs on»), включно з частковим перекриттям, яке дає
      попередження, а не блок.

  - statement: >
      Свіжість каталогу читається явно: панель показує вік останнього бару і
      окремо попереджає, коли він старіший за 30 днів, бо walk-forward на такій
      історії досліджує минуле, а не ринок.
    enforced_by: frontend/src/lib/format.ts
    verified_by: frontend/src/lib/format.test.ts
    note: >
      Поле `catalog_last_date` довгий час оголошувалося в типах фронтенду і не
      поверталося бекендом (див. інваріант нижче), тож ця панель не мала даних
      узагалі. Пороги (7/30 днів) — конвенція UI, а не вимір: вони нічого не
      доводять про стратегію, лише не дають прочитати старий каталог як свіжий.
      Невідома дата лишається `unknown`, а не «свіжою».

  - statement: >
      Панель, яка показує свіжість даних, отримує ці поля з бекенда: UI малює
      `catalog_last_date` і `catalog_total_bars` лише тоді, коли вони є, тож
      відсутнє поле = тихо порожня панель, а не помилка.
    enforced_by: src/nautilus_lab/api/command_center.py
    verified_by: tests/unit/test_api_data_series.py::test_command_center_reports_catalog_freshness
    note: >
      Це не гіпотетичний ризик: тип `CommandCenterResponse` у
      frontend/src/services/api.ts оголошував обидва поля, а `build_command_center`
      їх не повертав — рядки «Data last date» і «Total bars stored» не
      відображалися жодного разу. Тест фіксує контракт, а не факт наявності
      даних у каталозі.

  - statement: >
      API не виконує запит із чужого origin: браузерний запит, що несе заголовок
      Origin не зі списку `API_ALLOWED_ORIGINS`, отримує 403, а за заданого
      `API_TOKEN` кожен виклик `/api` вимагає `X-Lab-Token` (для WebSocket — `?token=`).
    enforced_by: src/nautilus_lab/api/security.py
    verified_by: tests/unit/test_api_security.py::test_foreign_origin_is_refused_even_without_a_token
    note: >
      До 2026-09-23 CORS був `*` разом із credentials і без автентифікації: будь-яка
      сторінка в тому ж браузері могла переписати `.env` (підмінити `LLM_BASE_URL` і
      забрати `LLM_API_KEY`) або запускати процеси. Прогін через сам застосунок —
      tests/unit/test_api_security_gate.py::test_cross_site_settings_write_is_refused.

  - statement: >
      На сервері з `LAB_ROLE=paper` API приймає лише читання та керування живим
      paper-терміналом; research, ingest, ML, alpha-пропозиції, пакетний paper-джоб
      і `PUT /api/settings` отримують 403. Невідоме значення `LAB_ROLE` не стартує.
    enforced_by: src/nautilus_lab/api/security.py
    verified_by: tests/unit/test_api_security.py::test_paper_role_refuses_research_and_settings_writes
    note: >
      Сервер, який переписує власні налаштування з браузера, дає журнал угод, який
      ніхто не відтворить. Дослідження живе на робочій станції (docs/26).

  - statement: >
      Живий paper-сеанс, перерваний не людиною (деплой, краш, ребут), відновлюється
      при старті API з журналу `LIVE_PAPER_JOURNAL` з тією самою конфігурацією,
      балансом, позицією та стопами; зупинений людиною сеанс не відновлюється.
    enforced_by: src/nautilus_lab/api/live_paper_boot.py
    verified_by: tests/unit/test_live_paper_persistence.py::test_restart_resumes_account_position_fills_and_equity
    note: >
      До 2026-09-24 весь реєстр терміналу жив у пам'яті процесу. Бари, що закрились
      під час простою, перевіряються проти стопа —
      tests/unit/test_live_paper_persistence.py::test_stop_hit_while_offline_is_filled_at_its_level.

  - statement: >
      Кілька живих paper-сесій працюють незалежно (свій рахунок, запобіжники і журнал),
      сесії одного symbol+interval отримують однакові бари з одного фіду, а файл
      портфеля не перезапускає сесію, яку зупинила людина.
    enforced_by: src/nautilus_lab/api/live_sessions.py
    verified_by: tests/unit/test_live_sessions.py::test_restart_resumes_every_session_and_the_portfolio_does_not_duplicate
    note: >
      Однакові бари — tests/unit/test_live_sessions.py::test_two_sessions_share_one_feed_and_see_the_same_bars.

  - statement: >
      Налаштований журнал, у який процес не може писати, зупиняє API на старті:
      якщо `LIVE_PAPER_JOURNAL` або `LIVE_PAPER_SESSIONS_DIR` вказують у теку, якої
      не створити чи не записати, застосунок падає з `RuntimeError`, а не веде сесії в
      пам'яті. Порожній `LIVE_PAPER_JOURNAL` (режим спостереження) — не помилка.
    enforced_by: src/nautilus_lab/api/live_paper_boot.py
    verified_by: tests/unit/test_live_paper_persistence.py::test_api_refuses_to_start_instead_of_running_without_a_ledger
    note: >
      Паперовий термінал без ledger — не «деградований режим»: дашборд виглядав би
      здоровим, а єдиний артефакт, заради якого сервер існує, лишався б порожнім. Саме
      це сталось на VPS: `data/` належить іншому uid, ніж uid 1000 контейнера, і
      `mkdir /app/data/paper` дає EACCES (docs/26, troubleshooting). Перевірка робить
      реальний запис, а не `os.access`: read-only mount і повний диск теж мусять
      зупиняти старт. Серед роботи поведінка не змінилась — `paper_streamer` ловить
      `OSError` і лише логує, щоб диск не зупиняв торговий цикл.

  - statement: >
      Вкладка Decision Logs показує рішення саме тієї сесії, яку відкрито в UI:
      роут `/api/paper/sessions/{key}/decision-log` читає журнал за ТИМ САМИМ
      ключем, яким його записав writer — `session_id`. Ключ без живої сесії за ним
      (id дослідницького прогону, `single_backtest.session_id`) читається як
      звичайний ключ журналу, а не як `404`: саме його просить «Backtest Details».
      Сесія без id і вимкнене логування відповідають помилкою, а не порожнім «ok».
    enforced_by: src/nautilus_lab/api/routes/live.py
    verified_by: tests/unit/test_api_decision_log_route.py::test_decision_log_route_returns_the_session_s_own_records
    note: >
      Це не гіпотетичний ризик: до 2026-09-25 роут читав за `config.name`
      ("ema-eth"), а `JsonlDecisionLogWriter` ключував файл за роботом
      ("ema_2026-09-25.jsonl"), тож на VPS вкладка показувала «No decision logs
      found / Logs: 0», поки файли росли щогодини на закритті бару. Друга
      половина — те, що дві сесії одного робота не змішуються (hold-btc і
      hold-eth писали в один `hold_*.jsonl`):
      tests/unit/test_api_decision_log_route.py::test_decision_log_route_does_not_show_another_session_s_decisions;
      відсутній id і вимкнене логування —
      ...::test_decision_log_route_reports_a_session_that_has_no_id_yet і
      ...::test_decision_log_route_reports_logging_being_off. Ключування,
      санітизація імені файлу і retention закриті
      tests/unit/test_decision_log_writer.py.
      Бектест не має живої сесії, і до 2026-09-28 роут відповідав на його id
      `404 no live paper session '0d83e156-…'`: модалка «Backtest Details»
      показувала цей JSON замість рішень прогону. Тепер ключ резолвиться спільно
      з `decision-digest` (`resolve_decision_log_key`, api/live_sessions.py), і
      той самий випадок тримає
      ...::test_decision_log_route_reads_a_research_backtest_run (порожній ключ —
      «ok» без записів: ...::test_decision_log_route_reports_an_unknown_key_as_empty).

  - statement: >
      Retention журналу рішень рахує вік файлу за **часом запису**, а не за датою бару
      в назві: файл старший за `DECISION_LOG_RETENTION_DAYS` видаляється при старті
      writer'а, свіжий лишається незалежно від того, які дати в його назві.
      `DECISION_LOG_RETENTION_DAYS=0` не видаляє нічого.
    enforced_by: src/nautilus_lab/infrastructure/decision_log_writer.py
    verified_by: tests/unit/test_decision_log_writer.py::test_decision_log_writer_keeps_a_backtest_log_whose_bar_dates_are_history
    note: >
      Назва файлу містить дату **бару**: бектест по історії пише `2024-01-01` сьогодні,
      тож вік за назвою робив свіжий лог «старим». 2026-09-28 перезапуск API з таким
      правилом зніс ≈62 МБ рішень одного прогону (дати 2024-01-01…2026-09-19) — у
      модалці «Backtest Details» лишились три симульовані дні. Решта випадків:
      tests/unit/test_decision_log_writer.py::test_decision_log_writer_pruning (старий
      за часом запису видаляється, свіжий лишається) і
      ...::test_decision_log_writer_keeps_everything_when_retention_is_off.

  - statement: >
      Сторінка угоди однакова для paper-сесії та бектесту, бо обидві відновлюються з
      журналу рішень за одним ключем: `GET /api/paper/sessions/{key}/trades` віддає
      список (без пер-барних записів, зі `pnl_source`/`qty_known`/`fee_known`), а
      `.../trades/{id}` — саму угоду разом із записами, індикаторами на вході й виході
      та барами для графіка. Ключ без живої сесії (`single_backtest.session_id`) не є
      404: саме його просить модалка «Backtest Details».
    enforced_by: src/nautilus_lab/api/routes/live.py
    verified_by: tests/unit/test_api_trades_route.py::test_trades_work_for_a_backtest_run_with_no_live_session
    note: >
      Друга половина — те, що число не показується без своєї підстави: у бектесті
      філів у журналі немає (`fill_ids` порожні за задумом), тож результат там — це
      різниця цін на припущеному розмірі, і список це пише
      (test_trades_list_admits_a_price_only_pnl: `pnl_source == "price_delta"`,
      `qty_known is False`, `fee is None`). Комісія «нуль», якої ніхто не записував, —
      саме те, що перетворює діагностику на фальшиву бухгалтерію. Коли сесія жива,
      її власний журнал філів переважає арифметику цін
      (test_a_live_session_reports_pnl_and_fees_from_its_own_fills), а філ закриття
      попередньої позиції не приписується угоді, що відкрилась у ту саму мить
      (tests/unit/test_trade_history.py::test_reversal_does_not_inherit_the_previous_trade_s_closure).
      Порядок із журналом, який містить кілька проходів по тому самому вікну
      (walk-forward пише кожен фолд під одним id сесії), закритий
      ...::test_a_log_holding_several_passes_is_not_read_as_one_timeline: без цього
      вхід одного проходу змикався з входом наступного і список показував однобаровi
      «угоди» з однаковою ціною входу й виходу. Скільки записів прочитано і чи
      обрізано вікно (`truncated`, `windows`) роут каже явно, а не мовчить.

  - statement: >
      Слот джоба займається всередині запиту під блокуванням: другий запуск того
      самого джоба, поки перший ще не породив процес, отримує `status: error`, а
      опитування логу одразу після старту бачить `is_running: true`.
    enforced_by: src/nautilus_lab/api/app.py
    verified_by: tests/unit/test_api_job_slots.py::test_second_launch_is_refused_while_the_first_has_not_spawned

  - statement: >
      Перезапуск пакета (`POST /api/batches/{id}/restart`) стирає артефакти прогону
      — теки клітинок із журналами рішень, `last_run.json`, кеш `summary.json`,
      `batch.log` і `trials/` — і лише тоді запускає той самий `request` з
      `batch.json` заново, під тим самим id. Кеш видаляється обов'язково: інакше
      таблиця показала б числа старого прогону під новим статусом — тобто
      «перезапустив» читалось би як «порахував заново».
    enforced_by: src/nautilus_lab/api/routes/batches.py
    verified_by: tests/unit/test_batch.py::test_restart_route_wipes_the_old_run_and_relaunches_in_place
    note: >
      Клітинки переплановуються тим самим `plan_cells`, що й при старті: дотренована
      модель робить свою клітинку робочою, а зниклий каталог — заблокованою з
      причиною, і перезапуск не обіцяє більше, ніж дозволяє файлова система.
      Відмови — не помилки, а ворота: `422` для імпортованого свіпу (у нього немає
      придатного запиту) і коли робочих клітинок не лишилось, `409` поки будь-який
      пакет виконується (спершу `cancel`), `404`/`400` для невідомого чи
      некоректного id —
      tests/unit/test_batch.py::test_restart_refuses_an_import_a_running_batch_and_unknown_ids.
      Кнопка на фронті вимкнена рівно там, де API відмовить
      (`frontend/src/lib/batch.ts::restartBlockedReason`,
      frontend/src/lib/batch.test.ts), бо кнопка, яка дає бекенду сказати «ні», нічого
      не вчить дослідника. Чого тут немає: паралельного перезапуску кількох пакетів і
      перезапуску живого (running) пакета без скасування — обидва свідомо закриті
      воротами, а не реалізовані.

