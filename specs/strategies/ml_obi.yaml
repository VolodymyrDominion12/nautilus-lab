# =============================================================================
#  ml_obi — напрямок за мікроструктурою книги ордерів (OBI / WOFI / fade)
# =============================================================================
#  Статус candidate. Раніше тут стояло «blocked» із трьома причинами (немає
#  фіду книги, немає адаптера, немає моделі) — дві з трьох закрито кодом:
#    * фід книги є: `lab ingest --depth` + `ParquetOrderBookCatalog`
#      (`catalog/data/orderbook/<SYMBOL>/<date>.parquet`), у каталозі лежить
#      1 доба ETHUSDT (2026-09-21, знімки 100 мс);
#    * адаптер є: `subscribe_order_book_depth` + гілка `RobotName.ML_OBI`
#      у `_build_robot()`, робот у `BACKTEST_WIRED_ROBOTS` і в
#      `PAPER_SUPPORTED_ROBOTS`.
#  Лишається головне: виміру немає (`evidence.measured: false`). Одна доба
#  знімків — це не вибірка, на якій можна щось стверджувати.
#
#  Два дефекти, знайдені під час прогону paper-сесії (2026-09-23), виправлені:
#    1. `to_engine_books()` передавав усі 20 рівнів Binance у контейнер
#       `OrderBookDepth10` → `ValueError: bids length greater than maximum 10`;
#       тепер рівні обрізаються до 10 (`BOOK_DEPTH`);
#    2. `_has_working_order()` дивився лише на `cache.orders_open()`, який
#       порожній, доки ордер INFLIGHT, а `Portfolio` не показує позицію до
#       філу. Робот бачив `flat=True` при власних незакритих ордерах і наклав
#       тринадцять входів за одну секунду на реальній книзі ETH (≈4× від
#       ліміту 1x). Тепер вхід блокується, поки є inflight-ордер.
# =============================================================================
kind: strategy
name: ml_obi
version: "1.0"
status: candidate
params:
  - env: ml_obi_threshold
    type: Decimal
    tuned: false
    note: Поріг впевненості моделі, підбирається під час навчання, а не бектесту
title: "ML за дисбалансом книги: OBI + WOFI + fade → сигнал напрямку"

hypothesis: >
  Дисбаланс книги ордерів несе інформацію про найближчий рух ціни: якщо на
  бідах більше обсягу, ніж на асках (OBI), якщо цей перекіс швидко зростає
  (WOFI — різниця OBI між двома послідовними знімками) і якщо ліквідність
  зникає з протилежного боку (liquidity fade), то найближчий рух іде в бік
  переваги. Модуль кодує це як класифікацію «up / down / flat» із порогом
  упевненості 0.55: сигнал з'являється лише коли максимальна ймовірність
  досягає порогу. Гіпотеза перевірна тільки на потоці знімків книги — на барах
  ці три ознаки не існують.

blocked_reason: >
  Виміру немає, і причина тепер одна — обсяг даних книги, а не код. Дві з трьох
  початкових перешкод закрито: фід книги існує (`lab ingest --depth`,
  `ParquetOrderBookCatalog`), адаптер існує (`subscribe_order_book_depth`,
  гілка в `_build_robot()`, `BACKTEST_WIRED_ROBOTS`, `PAPER_SUPPORTED_ROBOTS`).
  Що лишається:
  (1) Історія книги — одна доба. У каталозі лежить лише
  `catalog/data/orderbook/ETHUSDT/2026-09-21.parquet`; історичного L2 публічно
  не існує (docs/23 §2), тож знімки можна тільки збирати вперед. На одній добі
  не можна ні підібрати поріг на IS, ні перевірити його на OOS.
  (2) Модель не натренована. `LightGBMDirectionClassifier` доступний, але
  `ml_obi_model_path` типово порожній, тож працює
  `HeuristicDirectionClassifier` — правила, а не навчання. Датасет для OBI
  (`application/train_obi.py`) і `lab ml --model-type obi` з'явились, але
  навчати їх можна лише на тій самій одній добі.
  (3) Модель виконання лишається грубою: `bar_execution=True` і ринкові ордери.
  Мікроструктурна перевага на такій симуляції міряє артефакти рушія, а не
  перевагу (docs/08 §7.2). Це не закривається кодом у межах цієї фази.

edge_conditions:
  - name: obi_carries_direction_information
    description: >
      Три ознаки з коду — `order_book_imbalance(depth=10)`,
      `weighted_order_flow_imbalance(depth=5)`, `liquidity_fade_velocity(depth=5)` —
      мусять нести інформацію про напрямок, достатню, щоб максимальна
      ймовірність класифікатора перевищувала поріг 0.55 (інакше `_pick_side()`
      повертає `None` і сигналу немає). Перевіряється тільки на історії знімків
      книги, якої лабораторія не має.
  - name: snapshot_cadence_matches_the_horizon
    description: >
      Ознаки визначені як різниці між двома послідовними знімками, а перший
      знімок завжди дає `None` (warmup у `on_book()`). Тож горизонт переваги
      мусить бути довшим за інтервал оновлення книги: якщо знімки приходять
      рідше, ніж триває сам рух, ідея не встигає бути реалізованою.

implementation:
  domain_module: src/nautilus_lab/domain/ml_obi_strategy.py
  strategy_class: MlObiStrategy
  backtest_adapter: signal_strategy
  wired_in_backtest: true
  grid_source: default_branch

invariants:
  no_lookahead: true
  closed_bars_only: true
  decimal_not_float: true
  fail_closed_without_adapter: false

evidence:
  measured: false
  beats_buy_hold: null
  notes: >
    Виміру немає: робота немає серед BACKTEST_WIRED_ROBOTS, а даних книги, на
    яких його треба міряти, у лабораторії немає (каталог містить лише 1-годинні
    бари ETHUSDT.SIM і BTCUSDT.SIM). Єдине «вимірювання» цього модуля — приклад
    у docs/09 §4 з двома вигаданими знімками книги; це демонстрація API, а не
    результат, і в evidence він не переноситься.

notes: >
  Доменний модуль — клас: `MlObiStrategy` з методом
  `on_book(snapshot: OrderBookSnapshot) -> Signal | None` і конструкторним
  параметром `threshold` (типово `Decimal("0.55")`). Навколо нього — супутні
  модулі, які варто знати, бо саме вони визначають, чого бракує:
  `domain/order_book.py` (`BookLevel`, `OrderBookSnapshot` із `validate()` —
  перехрещена або неправильно впорядкована книга падає явно),
  `domain/microstructure.py` (три функції ознак на `Decimal`),
  `domain/ml_classifier.py` (`DirectionProbabilities`, протокол `DirectionClassifier`),
  `infrastructure/lightgbm_classifier.py` (`HeuristicDirectionClassifier`,
  `LightGBMDirectionClassifier`).
  `infrastructure/orderbook_microstructure.py` (float/Polars:
  `compute_order_book_imbalance`, `compute_micro_price`,
  `compute_microstructure_dataframe`) — **окремий** швидкий набір функцій; він не
  підключений до ознак `MlObiStrategy` (docs/08 §10, пункт 10 плану).
  `params` у спеці немає свідомо: у робота немає жодного поля `Settings` — поріг
  0.55 це аргумент конструктора, а не env-змінна, і вигадувати йому `env` не можна.
  `minimum_bars` не вказано з тієї ж причини: гілки в `minimum_bars()` немає
  (код повернув би типове 50), але робот не споживає бари, тож число тут нічого
  не означає. `grid_source: default_branch` — гілки в `param_grid.py` немає.
  Валідатор дасть попередження про `strategy_class` при `backtest_adapter: none`:
  це очікувано, `MlObiStrategy` справді клас у вказаному модулі.

