# =============================================================================
#  regime — еталонна специфікація (на неї рівняйся, пишучи інші)
# =============================================================================
kind: strategy
name: regime
version: "1.0"
status: candidate
title: "Regime router: Donchian у тренді, Bollinger mean reversion у флеті"

hypothesis: >
  Ринок не має однієї «правильної» стратегії: в тренді працює пробій, у флеті —
  повернення до середнього. Якщо спершу класифікувати режим (Kaufman Efficiency
  Ratio + нахил EMA), а потім застосувати відповідну стратегію, результат має
  бути кращим за будь-яку з них окремо — за вирахуванням комісій і без
  використання майбутніх барів.

edge_conditions:
  - name: regime_is_detectable_in_advance
    description: >
      ER і нахил EMA на закритих барах розділяють тренд і флет краще за випадкове
      вгадування (пороги ENTER_TREND_ER=0.30 / EXIT_TREND_ER=0.20 з гістерезисом).
  - name: breakout_pays_in_trend
    description: >
      У розпізнаному тренді пробій Donchian дає співвідношення прибутку до
      просадки, яке покриває taker-комісію за round-trip.
  - name: reversion_pays_in_range
    description: >
      У розпізнаному флеті повернення від меж Bollinger до середньої дає
      достатньо руху, щоб покрити комісію.
  - name: switching_costs_do_not_eat_the_edge
    description: >
      Перемикання режимів не з'їдає перевагу: позиція не ліквідується, якщо новий
      режим сумісний з напрямком або якщо трендовий трейлінг-стоп ще не спрацював.
  - name: compatible_regime_transition
    description: >
      Позиція не скидається у FLAT, якщо новий режим відповідає напрямку поточної
      позиції (наприклад, SHORT зберігається при переході RANGE -> DOWNTREND).
  - name: trend_pullback_tolerance
    description: >
      Трендова позиція при переході в RANGE не ліквідується миттєво, якщо ціна
      не пробила трейлінг-рівень EMA, захищаючи угоду від випадкових шумів ER.

implementation:
  domain_module: src/nautilus_lab/domain/regime_router.py
  strategy_class: RegimeRouter
  backtest_adapter: signal_strategy
  wired_in_backtest: true
  minimum_bars: 150
  grid_source: default_branch
  signal_kind: direction

params:
  - env: DONCHIAN_PERIOD
    default: 20
    grid: [20, 40, 60, 90, 120]
    description: >
      Вікно пробою: сигнал на максимум/мінімум за N закритих барів у тренді.
      Підбирається разом із BB_PERIOD (у сітці за замовчуванням вони рухаються
      синхронно — одне значення на обидва).
  - env: BB_PERIOD
    default: 20
    grid: [20, 40, 60, 90, 120]
    description: Вікно смуг Bollinger для mean reversion у флеті.
  - env: BB_K
    default: 2
    grid: [2, 2.5, 3]
    description: >
      Множник стандартного відхилення. Ширші смуги = рідші, але «чистіші» входи.
  - env: ER_PERIOD
    default: 20
    tuned: false
    note: >
      Поза сіткою: ER — це класифікатор режиму, а не джерело переваги. Підбір
      його на IS означав би підгонку самого визначення режиму під історію.
  - env: TREND_EMA_PERIOD
    default: 40
    tuned: false
    note: Нахил EMA — друга ознака режиму; так само частина класифікатора, не edge.
  - env: SLOPE_LOOKBACK
    default: 10
    tuned: false
    note: Горизонт вимірювання нахилу; фіксований разом із ER_PERIOD.
  - env: ENTER_TREND_ER
    default: 0.30
    tuned: false
    note: >
      Поріг входу в тренд. Не підбирається свідомо: якщо його оптимізувати,
      гістерезис перетвориться на ще один параметр підгонки.
  - env: EXIT_TREND_ER
    default: 0.20
    tuned: false
    note: >
      Поріг виходу з тренду (нижчий за ENTER — це і є гістерезис, який не дає
      режиму «блимати» на межі).
  - env: REGIME_CONFIRMATION_BARS
    default: 1
    tuned: false
    note: >
      Кількість барів поспіль для підтвердження зміни режиму (фільтр пилки).
  - env: REGIME_RANGE_ALLOW_SHORT
    default: true
    tuned: false
    note: >
      false = range-лег не шортить верхню смугу Bollinger, а лише фіксує прибуток
      лонга. Перемикач гіпотези H3 (батч 20261001: range-шорти збиткові на BTC і ETH);
      вмикається лише через преєстрацію, не підбирається на IS.
  - env: REGIME_MIN_HOLD_BARS
    default: 0
    tuned: false
    note: >
      Мінімальне утримання позиції в барах до виходу чи розвороту (0 = вимкнено).
      Гіпотеза контролю витрат (батч 20261003: breakeven ≈ 5 bps < сплачених 7.5 bps).
      Не входить у сітку: вмикається лише через преєстрацію з фіксованим значенням,
      підбір значення на OOS заборонений.

invariants:
  no_lookahead: true
  closed_bars_only: true
  decimal_not_float: true
  # Робот підключений до рушія, тож fail-closed-вимога до нього не діє.
  fail_closed_without_adapter: false

timeframe_support:
  1h:
    status: active
    minimum_bars: 150
    notes: >
      Основний робочий таймфрейм лабораторії. За 1000 днів дає 60-150 угод на монету,
      усі 12 монет проходять ворота oos_fills >= 30 (батч 20261007_115350_batch).
  4h:
    status: constrained
    minimum_bars: 150
    warnings:
      - >
        За 1000 днів доступно лише ~6000 барів. При DONCHIAN_PERIOD >= 60 частота угод
        падає до 10-15 за 3 роки, через що 50% монет провалюють ворота oos_fills >= 30
        (батч 20261007_085132_batch).
      - >
        На 4h виходи за STOP_LOSS становлять 60% (90 SL проти 59 EXIT): розмах коливань
        4-годинної свічки вибиває стопи до розвитку тренду.
  15m:
    status: unsupported
    notes: >
      Шум молодшого таймфрейму та фіксована спотова комісія (7.5 bps round-trip)
      повністю нівелюють очікуваний edge від пробою.

parameter_constraints:
  - env: DONCHIAN_PERIOD
    rules:
      - condition: "interval == '4h'"
        max_value: 40
        reason: >
          При DONCHIAN_PERIOD >= 60 на 4h частота угод падає нижче 15 за 1000 днів
          (вимога воріт oos_fills >= 30 не виконується, дискваліфікація у воротах).
        derived_from_batch: "20261007_085132_batch"
      - condition: "interval == '1h'"
        min_value: 20
        max_value: 120
        reason: >
          При < 20 забагато хибних пробоїв на пилці; при > 120 вхід стається запізно,
          коли імпульс вичерпано.

  - env: BB_K
    rules:
      - condition: "interval == '4h'"
        max_value: 2.5
        reason: >
          BB_K=3 на 4h робить смуги надто широкими, блокуючи mean-reversion сигнали
          у флетовому режимі.
        derived_from_batch: "20261007_085132_batch"

  - env: REGIME_RANGE_ALLOW_SHORT
    rules:
      - condition: "spot == true"
        recommended_value: false
        reason: >
          Range-шорти на спотовому ринку збиткові на BTC/ETH через довгостроковий
          висхідний дрейф крипторинку.
        derived_from_batch: "20261001"

known_failure_modes:
  - id: FM-REGIME-01-LOW-FREQUENCY-4H
    symptom: "Дискваліфікація у воротах через oos_fills < 30 (сер. 14 угод за 1000 днів)."
    cause: >
      Завищений lookback (DONCHIAN_PERIOD >= 60) на 4h таймфреймі (60 барів = 10 діб),
      де пробій 10-денного екстремуму стається рідко.
    fix: "На 4h обмежувати DONCHIAN_PERIOD <= 40 або проводити дослідження на 1h барах."

  - id: FM-REGIME-02-STOP-HUNT-ON-4H-BREAKOUT
    symptom: "STOP_LOSS становить 60% усіх виходів (90 SL vs 59 EXIT на 4h батчі)."
    cause: >
      Вхід на пробої екстремуму 4h свічки купує локальний хай; відкат наступних свічок
      зносить стоп до розвитку тренду.
    fix: >
      Вхід на ретесті пробитого рівня або адаптація захисного стопу під ATR(4h).

  - id: FM-REGIME-03-RANGE-SHORT-BLEED
    symptom: "Систематичний від'ємний PnL у range-шортах."
    cause: "Шорт від верхньої межі Bollinger під час локальної консолідації бичачого тренду."
    fix: "Встановлювати REGIME_RANGE_ALLOW_SHORT=false (лише лонги та фіксація прибутку)."

evidence:
  measured: true
  beats_buy_hold: false
  reproduce: >
    uv run lab ingest --start 2024-01-01 --symbols ETHUSDT,BTCUSDT   # каталог ETH/USDT 1h
    uv run lab research --robot regime --folds 4
    Числа фолд-таблиці — docs/05-roboty.md §4; рядок-вердикт
    «does not beat buy&hold» друкує сам CLI.
  notes: >
    За README.md і docs/05-roboty.md §4: багатовіконний прогін (`--folds N`)
    з порівнянням проти buy&hold за той самий OOS-період не показує переваги —
    жоден із роботів планку не обганяє. Конкретні числа наводяться в docs/05,
    тут вони свідомо не дублюються, щоб не розійтися з першоджерелом.
    Статус candidate (а не rejected), бо гіпотеза не закрита: це «не доведено»,
    а не «доведено, що не працює».

notes: >
  Це перший і головний робот лабораторії, і водночас приклад чесного результату:
  ідея звучить переконливо, але вимір її не підтверджує. Саме тому він лишається
  в проєкті як еталон дисципліни, а не як «робоча стратегія».
  У сітці за замовчуванням (param_grid.py, останній блок) DONCHIAN_PERIOD і
  BB_PERIOD отримують одне значення — тому в params вони мають однакові grid.

references:
  - docs/05-roboty.md
  - docs/06-ryzyk-metryky.md
  - docs/07-yak-stvoryty-strategiyu.md
