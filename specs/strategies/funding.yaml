# =============================================================================
#  funding — дельта-нейтральний cash-and-carry на ставці фінансування
# =============================================================================
#  Статус candidate: доменний код і адаптер виконання funding_strategy
#  підключені до Nautilus BacktestEngine (BACKTEST_WIRED_ROBOTS у domain/regime.py).
#  Адаптер слухає бари споту й перпетуала, споживає події FundingRateUpdate,
#  оцінює FundingCashAndCarry.on_funding(snapshot), відкриває дельта-нейтральні
#  ринкові ордери (Spot BUY + Perp SELL) та нараховує виплати фандингу на утримувану
#  перпетуал-позицію в cash-баланс та еквіті стратегії.
# =============================================================================
kind: strategy
name: funding
version: "2.0"
status: candidate
title: "Funding cash-and-carry: спот лонг + перпетуал шорт, вхід за нетто-APY"

hypothesis: >
  Ставка фінансування перпетуала — це періодичний платіж між лонгами й шортами.
  Якщо тримати дельта-нейтральну конструкцію «спот лонг + перпетуал шорт», то
  ціновий рух двох ніг гасить сам себе, а дохід приходить із самого фандингу.
  Формула в коді каже, за якої умови це взагалі варте входу:
  `net = funding_rate − 2·taker_fee/holding_periods`, далі
  `annualized = net · 3 · 365` (три 8-годинні виплати на добу), і вхід лише якщо
  `annualized ≥ min_net_apy` та `|mark − index| / index ≤ basis_max`. Тобто
  гіпотеза стверджує: існують періоди, коли ставка фандингу з запасом покриває
  round-trip комісію, рознесену на очікуваний строк утримання, а базис
  лишається вузьким.

edge_conditions:
  - name: net_funding_beats_the_amortised_cost
    description: >
      Ідея має сенс лише якщо реальна ставка фандингу регулярно, а не в окремі
      дні, перевищує поріг входу
      `(funding_rate − 2·taker_fee/holding_periods) · 3 · 365 ≥ min_net_apy`
      (типово 0.10). Досяжність порогу прямо залежить від `holding_periods`
      (типово 30) — це видно з коду `FundingCashAndCarry._round_trip_fee_per_interval()`.
      ПЕРЕВІРЕНО НА ДАНИХ (`lab ingest --funding`; ETHUSDT, BTCUSDT, SOLUSDT,
      BNBUSDT, XRPUSDT, ADAUSDT, DOGEUSDT; 2024-01-01…2026-09-18; 2973 розрахунки
      на символ, 20811 разом):
        • за типових параметрів поріг 0.10 проходять 1545/20811 (7.4%) — гейт
          ДОСЯЖНИЙ, але вкрай нерівномірно в часі:
              2024: 1496/7686 (19.5%)
              2025:   26/7665 ( 0.3%)
              2026:   23/5460 ( 0.4%)
        • на ETHUSDT у 2025-2026 поріг не проходить ЖОДЕН розрахунок (0 з 1878).
      Медіанна нетто-дохідність по символу — від −3.7% (BNBUSDT) до +6.6%
      (ADAUSDT) річних. Тобто гіпотеза не мертва, але її вікно — 2024 рік: у
      2025-2026 ставка фандингу майже ніколи не покриває амортизовану комісію із
      запасом 10% річних.
  - name: basis_stays_inside_the_gate_while_held
    description: >
      Робот тримає позицію, лише поки `|mark − index| / index ≤ basis_max`
      (типово 0.005); при розходженні він виходить із позначкою "basis divergence",
      а при від'ємному фандингу — "negative funding". Тобто перевага існує лише
      якщо базис вузький протягом усього утримання, а не лише в момент входу.

implementation:
  domain_module: src/nautilus_lab/domain/funding.py
  strategy_class: FundingCashAndCarry
  backtest_adapter: funding_strategy
  wired_in_backtest: true
  minimum_bars: 15
  grid_source: explicit

params:
  - env: FUNDING_MIN_NET_APY
    default: 0.10
    grid: [0, 0.05, 0.10]
    description: >
      Мінімальна річна нетто-дохідність ставки фандингу за вирахуванням амортизованої
      round-trip комісії для відкриття дельта-нейтральної позиції спот лонг + перп шорт.
  - env: FUNDING_HOLDING_PERIODS
    default: 60
    grid: [30, 60, 90, 120]
    description: >
      Очікувана кількість 8-годинних інтервалів утримання позиції, на які амортизується
      round-trip комісія входу та виходу (2 taker fees).
  - env: FUNDING_MIN_EXIT_APY
    default: null
    tuned: false
    note: >
      Поріг виходу за згасанням ставки фандингу після min_holding_periods.
    description: >
      Мінімальна річна нетто-дохідність ставки фандингу, нижче якої позиція закривається (decay exit).
  - env: FUNDING_MIN_HOLDING_PERIODS
    default: 15
    tuned: false
    note: >
      Мінімальний строк утримання для захисту від передчасного закриття до амортизації комісії.
    description: >
      Кількість 8-годинних інтервалів, які позиція обов'язково утримується перед перевіркою min_exit_apy.
  - env: FUNDING_MAX_HOLDING_PERIODS
    default: null
    tuned: false
    note: >
      Максимальний строк утримання позиції в 8-годинних інтервалах; null — без примусового тайм-ауту.
    description: >
      Максимальна кількість 8-годинних періодів утримання позиції перед примусовим закриттям (тайм-аут).
  - env: FUNDING_BASIS_MAX
    default: 0.005
    tuned: false
    note: >
      Захисний гейт розходження базису: фіксований ліміт ризику розходження між спотом і перпом.
    description: >
      Максимально допустиме відносне розходження |mark - index| / index. Якщо базис
      перевищує поріг, вхід блокується, а відкрита позиція закривається (basis divergence).
  - env: FUNDING_CLOSE_ON_NEGATIVE
    default: false
    tuned: false
    note: >
      Вимкнено за замовчуванням (false): поодинокі 8h від'ємні ставки (зазвичай -0.001%) коштують ~$1 на $100k,
      тоді як закриття та повторне відкриття спалює 10-25 bps (~$100-$250) комісій тейкера (пилка).
    description: >
      Чи закривати позицію при переході ставки фандингу у від'ємну зону.
  - env: FUNDING_SPOT_ID
    default: "ETH/USDT.SIM"
    tuned: false
    note: >
      Визначає спотовий інструмент для довгої ноги; не підбирається в сітці параметрів.
    description: >
      Ідентифікатор спотового інструменту для довгої ноги кеш-енд-керрі.
  - env: FUNDING_PERP_ID
    default: "ETHUSDT-PERP.SIM"
    tuned: false
    note: >
      Визначає інструмент безстрокового контракту для короткої ноги; не підбирається в сітці.
    description: >
      Ідентифікатор безстрокового ф'ючерсу (perpetual) для короткої ноги кеш-енд-керрі.
  - env: SPOT_TAKER_FEE
    default: 0.001
    tuned: false
    note: >
      Комісія біржі для ринкових ордерів. Задається параметрами біржі, а не оптимізацією стратегії.
    description: >
      Комісія тейкера, що сплачується при відкритті та закритті обох ніг ринковими ордерами.
  - env: RISK_PER_TRADE
    default: 0.005
    tuned: false
    note: >
      Свідомо поза сіткою: розмір рахує ризик-шар (application/risk.py), а не робот.
    description: >
      Частка капіталу під ризиком на угоду, яка передається в розрахунок розміру позиції.
  - env: STOP_PCT
    default: 0.01
    tuned: false
    note: >
      Запасна дистанція до стопу на ногу для формули розміру позиції.
    description: >
      Запасна дистанція до стопу на ногу для розміру позиції.
  - env: MAX_OPEN_POSITIONS
    default: 1
    tuned: false
    note: >
      Стеля відкритих позицій у circuit breaker.
    description: >
      Ліміт відкритих позицій у circuit breaker.

invariants:
  no_lookahead: true
  closed_bars_only: true
  decimal_not_float: true
  fail_closed_without_adapter: false

evidence:
  measured: true
  beats_buy_hold: false
  reproduce: >
    Клітинки funding_BTC і funding_ETH пакета reports/batches/20261003_182518_batch
    (дашборд → «Пакетний бектест»: robots=["funding"], symbols=["BTCUSDT","ETHUSDT"],
    folds=6, days=1000; клітинки funding ідуть у catalog_2019_4h / 4h).
    Той самий прогін із CLI — підкоманди `lab batch` не існує, тому через env:
    CATALOG_PATH=catalog_2019_4h INSTRUMENT_ID=BTC/USDT.SIM BAR_INTERVAL=4h
    FUNDING_SPOT_ID=BTC/USDT.SIM FUNDING_PERP_ID=BTCUSDT-PERP.SIM
    .venv/bin/lab research --robot funding --folds 6 --days 1000
  notes: >
    Виміряно в пакеті 20261003_182518_batch (1000 днів, 6 фолдів, catalog_2019_4h, 4h):
    - BTC: 3/6 прибуткових фолдів, mean_oos = +0.077%, buy&hold = -0.114%, beats_buy_and_hold = true,
      20 total OOS fills, breakeven cost = 12.29 bps > paid cost 6.25 bps.
    - ETH: 4/6 прибуткових фолдів, mean_oos = +0.025%, buy&hold = +0.344%, beats_buy_and_hold = false,
      24 total OOS fills, breakeven cost = 7.48 bps > paid cost 6.25 bps.
    За сукупністю двох інструментів beats_buy_hold = false (перевага над buy&hold не підтверджена на ETH).
    Плече 1× (default_leverage = 1), ліквідація короткої ноги перпетуалу в бектесті не моделюється.
    Статус робота: candidate.

notes: >
  Доменний модуль: `FundingCashAndCarry` з методом
  `on_funding(snapshot: FundingSnapshot) -> SpreadSignal | None`, плюс дата-класи
  `FundingSnapshot` і `FundingParams`.
  Адаптер рушія: `FundingRobot` у `src/nautilus_lab/infrastructure/nautilus/funding_strategy.py`.
  Рушій NautilusTrader отримує бари споту й перпетуала разом з подіями FundingRateUpdate.
  На кожній виплаті фандингу адаптер нараховує грошовий потік на коротку перпетуал-позицію:
  delta = -signed_perp_qty * mark_price * funding_rate, і додає його до еквіті.
  Публічні гейти робота: вхід — `annualized >= min_net_apy` і `|basis| <= basis_max`,
  вихід — від'ємний фандинг (`close_on_negative`), розходження базису або невідомий індекс.

