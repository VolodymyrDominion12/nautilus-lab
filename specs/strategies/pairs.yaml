# =============================================================================
#  pairs — статистичний арбітраж на двох ногах (ETH/BTC)
# =============================================================================
kind: strategy
name: pairs
version: "1.0"
status: candidate
title: "Pairs trading: коінтеграція ETH/BTC і повернення до середнього за z-score"

hypothesis: >
  ETH і BTC не просто корелюють, а коінтегровані: їхня лінійна комбінація
  (спред із хедж-коефіцієнтом β) повертається до сталого середнього, а швидкість
  цього повернення можна оцінити через half-life процесу Орнштейна-Уленбека.
  Якщо це справді так, то відхилення спреду на z_entry стандартних відхилень є
  входом із додатним очікуванням: спред повертається до z_exit швидше, ніж
  taker-комісії, сплачені двічі на кожній із двох ніг (вхід і вихід), з'їдають
  цей рух. Твердження спростовне:
  якщо після проходження обох воріт — ADF p-value ≤ adf_pvalue_max і
  half_life ≤ max_half_life_bars — середнє OOS за фолдами не вище за buy&hold за
  ті самі вікна, то статистичної переваги тут немає, і робот лишається
  candidate, а не validated.

edge_conditions:
  - name: cointegration_holds_out_of_sample
    description: >
      Обидва ворота мусять пропускати пару не лише на in-sample: ADF p-value ≤
      0.05 на ковзному вікні LOOKBACK = 120 барів і half_life ≤ 240 барів. Якщо
      після першого успішного фіту залишок спреду перестає бути стаціонарним,
      вся конструкція описує минуле, а не ринок.
  - name: reversion_covers_two_fees
    description: >
      Швидкість повернення κ (а отже half_life) має бути такою, щоб типовий рух
      спреду від z_entry до z_exit перекривав taker-комісію, сплачену на обох
      ногах при вході й на обох при виході, плюс прослизання. Якщо половина
      розходження зникає за час, за який комісії з'їдають більше, ніж дає сам
      рух, то частіші угоди лише прискорюють втрату.
  - name: hedge_ratio_stable_enough
    description: >
      β не має «пливти» протягом утримання позиції: при refit_every_bars = 0
      хедж-коефіцієнт фіксується на першому успішному вікні, тож перевага існує
      лише якщо зв'язок між ногами не змінюється за час угоди. Time stop у
      2 × half_life барів — це визнання того, що модель може перестати
      описувати реальність.
  - name: market_neutrality_beats_buy_and_hold
    description: >
      Спред торгується в обидві сторони, тому планка — buy&hold за той самий
      OOS-період. Якщо середнє за фолдами не вище за `baseline buy&hold mean`,
      дельта-нейтральність не додала нічого понад зниження направленого ризику.

implementation:
  domain_module: src/nautilus_lab/domain/pairs/
  strategy_class: SpreadRobot
  backtest_adapter: spread_strategy
  wired_in_backtest: true
  minimum_bars: 200
  grid_source: explicit
  signal_kind: spread_pair

params:
  - env: PAIRS_REFIT_EVERY
    default: 0
    tuned: false
    note: >
      Єдина змінна пари, яку Settings реально віддає в домен
      (`Settings.pairs_params()` → `PairsParams.refit_every_bars`). Поза сіткою:
      сітка для `pairs` перебирає лише z_entry. `0` заморожує β, μ і σ після
      першого успішного фіту; `N > 0` переоцінює коінтеграцію раз на N барів і
      закриває позицію, якщо пара перестала проходити ворота. Той самий параметр
      задає каденцію повторних спроб для закритих воріт, тому його значення
      впливає і на швидкість прогону, і на те, чи встигне робот увійти взагалі.
      Воно мусить бути зафіксоване до прогону OOS, а не підібране по ньому.
  - env: PAIRS_Z_ENTRY_QUANTILE
    default: 0
    tuned: false
    note: >
      Поріг входу як ЕМПІРИЧНИЙ квантиль вікна спреду замість припущення про
      нормальність. `0` = вимкнено: працює фіксований z_entry (поточна
      поведінка, тож усі задокументовані прогони лишаються чинними). Значення
      `p` у (0, 0.5) вмикає квантильний режим: вхід у лонг спреду за квантилем
      `p`, у шорт — за квантилем `1 - p`, обидва переведені в одиниці z тією ж
      парою (μ, σ), що й сам z. Це прибирає неявне припущення «спред
      нормальний»: на важких хвостах квантиль стоїть далі від центру, ніж
      1.96σ, і робот не входить у рух, який для цього розподілу є звичайним.
      Поза сіткою навмисно: сітка `pairs` перебирає лише `z_entry`, а в
      квантильному режимі `z_entry` ігнорується — змішувати їх в одному
      переборі означало б підбирати параметр, який ні на що не впливає.
      Значення мусить бути зафіксоване до прогону OOS, а не підібране по ньому.
      Квантиль рахується на тому самому ковзному вікні, що й фіт коінтеграції,
      і заморожується разом із ним: при `PAIRS_REFIT_EVERY=0` пороги не
      перераховуються всередині угоди, тож заглядання в майбутнє немає.
  - env: RISK_PER_TRADE
    default: 0.005
    tuned: false
    note: >
      Свідомо поза сіткою: розмір рахує ризик-шар (application/risk.py), а не
      робот. Для спреду нога A отримує повну частку, нога B — частку × |β|
      (qty_weight у SpreadSignal), тобто відносний розмір другої ноги визначає
      хедж-коефіцієнт, а не окремий параметр.
  - env: STOP_PCT
    default: 0.01
    tuned: false
    note: >
      Запасна відстань до стопа на кожну ногу: поки ATR(14) не прогрівся, вона
      дорівнює price × STOP_PCT, далі — ATR × atr_stop_multiplier (2). Це
      правило розміру позиції, а не сигнал, тому разом із z_entry воно не
      підбирається.
  - env: MAX_OPEN_POSITIONS
    default: 1
    tuned: false
    note: >
      Стеля відкритих ніг у circuit breaker. Увага на розходження: у
      SpreadRobotConfig типово 2 («бо ніг дві»), але CLI-шлях прокидає сюди
      MAX_OPEN_POSITIONS зі Settings (типово 1). Вхід у спред відбувається зі
      стану flat (open_positions = 0), тому ліміт угоди не блокує; docs/05 §3.5
      цитує 2 — це типове значення конфіга адаптера, а не те, що приходить із
      CLI.
  - env: TAKER_FEE
    default: 0.001
    tuned: false
    note: >
      Обидві ноги — ринкові ордери, тож вхід і вихід платять taker-комісію двічі
      (по разу на ногу), а розворот — чотири рази. Комісія є властивістю біржі, а
      не стратегії; тут вона названа як планка, яку має перекрити рух спреду від
      z_entry до z_exit.

invariants:
  no_lookahead: true
  closed_bars_only: true
  decimal_not_float: true
  # Робот підключений до рушія, тож fail-closed-вимога до нього не діє.
  fail_closed_without_adapter: false

evidence:
  measured: true
  beats_buy_hold: false
  reproduce: >
    uv run lab ingest --start 2024-01-01 --symbols ETHUSDT,BTCUSDT   # каталог ETH/USDT 1h
    uv run lab research --robot pairs --folds 4
    Числа фолд-таблиці — docs/05-roboty.md §4 (рядок `pairs`); рядок-вердикт
    «does not beat buy&hold» друкує сам CLI.
  notes: >
    За docs/05-roboty.md §3.7 і §4 (таблиця фолдів та агрегат OOS): робот
    виміряно — після виправлення ADF він справді торгує на обох вибірках, але
    середнє OOS за фолдами нижче за buy&hold, тож рядок-вердикт звіту —
    «не обганяє buy&hold». Конкретні числа наводяться в docs/05, тут вони
    свідомо не дублюються, щоб не розійтися з першоджерелом. Статус candidate (а
    не rejected), бо гіпотеза не закрита: docs/05 §3.7 прямо каже, що це
    «стратегію вперше видно», а не «стратегія заробляє», і називає наступний
    крок — періодичну переоцінку коінтеграції, а не послаблення воріт.

notes: >
  Логіка — три цеглинки: коінтеграція (OLS-регресія y ~ α + β·x і ADF-тест на
  залишках, domain/pairs/cointegration.py), процес Орнштейна-Уленбека з
  half-life (domain/pairs/ou.py) і правила торгівлі (domain/pairs/pairs_trading.py).
  Тому domain_module тут — тека, а клас, який інстанціює рушій, живе в адаптері:
  SpreadRobot (spread_strategy.py) підписується на бари обох інструментів, чекає
  збігу міток часу, перед входом закриває обидві ноги й надсилає два ринкові
  ордери. PairsTrading лишається чистим доменом: жодного Nautilus, жодного .env.
  Ворота коінтеграції закриті за замовчуванням, і це навмисно: спершу
  adf_pvalue ≤ adf_pvalue_max (0.05), потім half_life ≤ max_half_life_bars (240
  барів) на ковзному вікні LOOKBACK = 120. Якщо хоч одна не пройдена — угод не
  буде взагалі, і `fills=0` у звіті є чесною відповіддю «пари з такою
  статистикою немає», а не ознакою зламаного робота. Послаблювати ці пороги «щоб
  заторгувало» заборонено: саме так у проєкті вже з'явився мертвий ADF-тест,
  який не міг відкрити ворота за жодних даних (історія — docs/05 §3.1,
  docs/07 §5).
  Фіт при цьому не робиться раз і назавжди: PairsTrading повторює спробу на
  ковзному вікні, доки ворота не пройдуть, тож невдале перше вікно не означає,
  що робот не торгуватиме (docs/05 §3.4).
  z_entry, z_exit, lookback, adf_pvalue_max і max_half_life_bars живуть у
  PairsParams як доменні типові значення; у Settings для них немає полів, а
  валідатор звіряє кожен params[].env із полями Settings — тому описати їх як
  параметри не можна, і вони названі тут текстом. Сітка підбору для `pairs`
  перебирає рівно одне число: z_entry ∈ {1.5, 2, 2.5} (param_grid.py; те саме в
  docs/05 §3.6), а z_exit, lookback і ворота фіксовані. Це означає, що значення
  z_entry змінюється лише підбором на in-sample — в .env для нього змінної немає.
  Ноги пари задані в PairsParams (leg_a = ETH/USDT.SIM, leg_b = BTC/USDT.SIM) і
  окремої змінної теж не мають.
  Друге джерело порога входу — PAIRS_Z_ENTRY_QUANTILE (єдина пара-змінна, крім
  PAIRS_REFIT_EVERY, яку Settings віддає в домен). Два режими взаємовиключні:
  при `0` діє фіксований z_entry, при `p ∈ (0, 0.5)` — емпіричні квантилі `p` і
  `1 - p` того самого вікна, і z_entry не читається взагалі. Режим вимкнено за
  замовчуванням саме тому, що перехід у нього — це нова гіпотеза, яку треба
  виміряти на OOS, а не покращення, яке можна ввімкнути мовчки: числа
  docs/05 §4 отримані у фіксованому режимі, і вони лишаються чинними лише поки
  типова конфігурація не змінилась.

references:
  - docs/05-roboty.md
  - docs/06-ryzyk-metryky.md
  - docs/07-yak-stvoryty-strategiyu.md
