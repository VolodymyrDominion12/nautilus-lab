# nautilus-lab on a VPS: live paper terminal + dashboard + tick collector.
#
#   cp deploy/vps.env.example .env          # backend settings (LAB_ROLE=paper, ...)
#   cp deploy/compose.env.example deploy/.env # bind address, site address, token
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# Everything the server produces lives in bind-mounted folders at the repo root —
# data/ (live paper journal), catalog/ (ticks), reports/ — so `scripts/pull_vps.sh`
# can rsync them to the workstation and a rebuild never touches them.
name: nautilus-lab

# Least privilege for every service (docs/27 E-1.8). A container that is broken into
# cannot change its own code (read-only root), gain privileges (no-new-privileges, no
# capabilities) or fork-bomb and starve the paper sessions (pids/memory limits). Only
# the bind-mounted data folders, the named volumes and a small /tmp are writable.
x-hardening: &hardening
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 256
  tmpfs:
    - /tmp:size=64m

services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
      args:
        LAB_REVISION: ${LAB_REVISION:-}
        APP_UID: ${APP_UID:-1001}
        APP_GID: ${APP_GID:-1001}
    restart: unless-stopped
    <<: *hardening
    # 8 sessions + NautilusTrader imports; the limit keeps an OOM inside this container
    # instead of taking the whole VPS (and the collector, and Caddy) down with it.
    mem_limit: ${API_MEM_LIMIT:-1536m}
    environment:
      # The root filesystem is read-only; libraries that cache under $HOME use /tmp.
      XDG_CACHE_HOME: /tmp/.cache
      MPLCONFIGDIR: /tmp/matplotlib
    volumes:
      - ../.env:/app/.env:ro
      - ../data:/app/data
      - ../reports:/app/reports
      - ../catalog:/app/catalog
    # Not published: only Caddy reaches it, over the compose network.
    expose:
      - "8000"
    stop_grace_period: 20s
    logging: &logging
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        VITE_API_TOKEN: ${API_TOKEN:-}
    restart: unless-stopped
    <<: *hardening
    # Caddy runs as root in its image and binds :80/:443: that one capability back.
    cap_add:
      - NET_BIND_SERVICE
    mem_limit: ${WEB_MEM_LIMIT:-256m}
    depends_on:
      - api
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      # Lock for a dashboard reachable beyond Tailscale (deploy/Caddyfile header).
      DASHBOARD_AUTH: ${DASHBOARD_AUTH:-off}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH:-}
      # Report-Only until the browser console is clean (deploy/Caddyfile).
      CSP_MODE: ${CSP_MODE:-Content-Security-Policy-Report-Only}
    ports:
      # Docker publishes around ufw/iptables rules, so the bind address IS the firewall.
      # Tailscale-only: set BIND_ADDR to the server's 100.x.y.z address.
      # Public domain: BIND_ADDR=0.0.0.0 (and SITE_ADDRESS=your.domain for HTTPS).
      - "${BIND_ADDR:-127.0.0.1}:80:80"
      - "${BIND_ADDR:-127.0.0.1}:443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    logging: *logging

  # Live aggTrades from the public Binance WebSocket into catalog/data/agg_trade/.
  # REST history of ticks is not reachable in practice (docs/24 §5.2); a stream that
  # runs for weeks is. One bounded `lab ingest --live-ticks` per symbol, restarted in
  # a loop, so a stuck socket costs at most one window.
  collector:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
      args:
        LAB_REVISION: ${LAB_REVISION:-}
        APP_UID: ${APP_UID:-1001}
        APP_GID: ${APP_GID:-1001}
    restart: unless-stopped
    profiles: ["collector"]
    command: ["/bin/sh", "/app/deploy/collect_ticks.sh"]
    <<: *hardening
    mem_limit: ${COLLECTOR_MEM_LIMIT:-768m}
    environment:
      XDG_CACHE_HOME: /tmp/.cache
      TICK_SYMBOLS: ${TICK_SYMBOLS:-ETHUSDT}
      TICK_WINDOW_MINUTES: ${TICK_WINDOW_MINUTES:-60}
    volumes:
      - ../.env:/app/.env:ro
      - ../catalog:/app/catalog
      - ./collect_ticks.sh:/app/deploy/collect_ticks.sh:ro
    logging: *logging

  # Off-server backup of the paper journals, reports and collected ticks (restic; see
  # deploy/backup.sh and docs/26 §7). Opt-in: COMPOSE_PROFILES=collector,backup and the
  # RESTIC_* settings in deploy/.env. Everything is mounted read-only: a backup job has
  # no business writing into the ledger it copies.
  backup:
    image: restic/restic:0.17.3
    restart: unless-stopped
    profiles: ["backup"]
    entrypoint: ["/bin/sh", "/backup.sh"]
    <<: *hardening
    # restic runs as root; DAC_READ_SEARCH lets it read files of the app user whatever
    # their mode, and nothing else (the mounts are read-only anyway). Prune needs memory.
    cap_add:
      - DAC_READ_SEARCH
    mem_limit: ${BACKUP_MEM_LIMIT:-1g}
    environment:
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      B2_ACCOUNT_ID: ${B2_ACCOUNT_ID:-}
      B2_ACCOUNT_KEY: ${B2_ACCOUNT_KEY:-}
      BACKUP_PATHS: ${BACKUP_PATHS:-}
      BACKUP_EVERY_SECONDS: ${BACKUP_EVERY_SECONDS:-}
      BACKUP_KEEP: ${BACKUP_KEEP:-}
      BACKUP_HEARTBEAT_URL: ${BACKUP_HEARTBEAT_URL:-}
      RESTIC_CACHE_DIR: /cache
      # prune writes temporary packs; the 64 MB /tmp is too small for that.
      TMPDIR: /cache/tmp
    volumes:
      # Whole folders, never single files or sub-folders: a bind mount of a path that
      # does not exist yet makes Docker create it as root, and the API (uid 1000) could
      # then not write its journal there.
      - ../data:/backup/data:ro
      - ../reports:/backup/reports:ro
      - ../catalog:/backup/catalog:ro
      - ./backup.sh:/backup.sh:ro
      - restic_cache:/cache
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
  restic_cache:
