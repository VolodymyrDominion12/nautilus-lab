# =============================================================================
#  risk-layer — розмір позиції та запобіжники (circuit breakers)
# =============================================================================
#  Третя компонентна спека. Статус partial — і це не «недороблена спека», а
#  чесна назва стану: аварійний вимикач (`kill_switch.py`) існує лише як
#  заглушка, яка нічого не скасовує. Головний інваріант шару (стратегія не
#  вирішує розмір) теж без тесту — тому він стоїть із test_missing_reason.
# =============================================================================
kind: component
name: risk-layer
version: "1.0"
status: partial
title: "Розмір позиції від стопу, ліміти й circuit breakers — поза стратегією"

hypothesis: >
  Ризик-шар — це єдине місце, де вирішується розмір позиції, і єдине, що стоїть
  між ідеєю та рахунком: стратегія каже лише напрямок, розмір виводиться зі стопу
  й частки капіталу під ризиком, а circuit breakers зупиняють нові входи, коли
  крива ламається. Якщо розсиплеться хоч одне з цього, прибутковим виглядатиме
  навіть шум.

# Спільний блок `invariants` обов'язковий для КОЖНОЇ спеки (specs/_schema.yaml,
# common.required). Тут він повторює дисципліну компонента тим самим словником,
# що й у спек роботів. Машинно перевірені пари «модуль + тест» — нижче,
# в invariants_enforced; там же видно, що саме з цього списку сьогодні без тесту.
invariants:
  strategy_returns_direction_only: true
  risk_per_trade_is_a_fraction_at_risk: true
  decimal_not_float: true
  breakers_block_new_entries_only: true
  protective_stop_never_loosens: true

invariants_enforced:
  - statement: >
      Стратегія не вирішує розмір позиції: домен повертає лише напрямок (і
      відносну вагу ніг у спреді), а кількість рахує `application/risk.py`.
    enforced_by: src/nautilus_lab/domain/signals.py
    verified_by: tests/unit/test_component_invariants.py::test_domain_strategies_do_not_size_positions
    note: >
      Порушення цього інваріанта — найдорожче в лабораторії: стратегія, яка сама
      собі вибирає розмір, підганяє його під минулі бари, і перевага зникає на
      out-of-sample, хоч у звіті вона є.

  - statement: >
      `risk_per_trade` — це частка капіталу, яку можна ВТРАТИТИ в одній угоді, а не
      розмір позиції: кількість виводиться зі стопу, і ноціонал ніколи не
      перевищує 1x капіталу (жодного кредитного плеча).
    enforced_by: src/nautilus_lab/application/risk.py
    verified_by: tests/unit/test_risk.py::test_size_position_risks_fraction_of_equity_capped_at_1x
    note: >
      Обмеження 1x закрито окремо —
      tests/unit/test_risk.py::test_size_position_caps_notional_at_equity.
      Якщо читати `risk_per_trade` як «розмір позиції», то цифри в звіті зростають
      рівно настільки, наскільки вузький стоп, — і ризик перетворюється на
      фікцію: однакова частка капіталу «під ризиком» дає різний реальний ризик.

  - statement: >
      Спрацьований circuit breaker (денний збиток, просадка від піку, VaR або
      CVaR-поріг) блокує саме НОВІ входи — і це не баг, а робота механізму.
    enforced_by: src/nautilus_lab/application/risk.py
    verified_by: tests/unit/test_risk.py::test_evaluate_entry_trips_daily_loss
    note: >
      Ті самі ворота закриті для просадки
      (tests/unit/test_risk.py::test_evaluate_entry_trips_drawdown) і для CVaR
      (tests/unit/test_risk.py::test_evaluate_entry_trips_cvar_breaker), а здорове
      зведення мусить проходити
      (tests/unit/test_risk.py::test_evaluate_entry_allows_healthy_account) — без
      останнього тесту запобіжник можна було б «полагодити» в завжди-закритий і
      назвати це обережністю. У прогні це виглядає як `max_dd`, що впирається в
      `MAX_DRAWDOWN`, і менше входів: послаблювати ліміт, щоб «заторгувало», — саме
      та помилка, від якої цей інваріант захищає. Запобіжник не закриває позицію
      сам — але й не заважає її закрити: вихід (FLAT або зустрічний сигнал) ніколи
      не проходить через `evaluate_entry` (див. інваріант нижче), а збиток відкритої
      позиції обмежує захисний стоп-ордер.

  - statement: >
      Вихід ніколи не блокується ризик-шаром: зустрічний або FLAT-сигнал закриває
      наявну позицію навіть тоді, коли кожен запобіжник спрацював; через
      `evaluate_entry` проходить лише нова експозиція.
    enforced_by: src/nautilus_lab/domain/position_plan.py
    verified_by: tests/unit/test_position_plan.py::test_opposite_signal_exits_even_when_the_entry_will_be_refused
    note: >
      До 2026-09-23 адаптери питали ризик першими й виходили з `return` на відмові,
      тож зустрічний сигнал губився разом із входом. У paper-сесії ema це тримало
      шорт від 1897 до 2612 (−18 909 USDT нереалізованого) під 946 відмовами
      «max drawdown circuit breaker». Таблиця рішень —
      tests/unit/test_position_plan.py::test_plan_for_signal_truth_table.

  - statement: >
      Капітал, який бачать крива, метрики й запобіжники, — це баланс плюс відкриті
      позиції за останньою ціною, а не лише реалізований баланс MARGIN-рахунку.
    enforced_by: src/nautilus_lab/domain/marking.py
    verified_by: tests/unit/test_marking.py::test_short_under_water_reduces_equity
    note: >
      `balance_total` на MARGIN-рахунку рухається лише на реалізованому PnL і
      комісіях, тому до виправлення `max_dd`, Sharpe, VaR/CVaR і денний/просадковий
      ліміти не бачили відкритих збитків. Той самий розрахунок додає відкриту в
      кінці вікна позицію до `BacktestReport.ending_balance` (OOS-дохідність,
      оцінка in-sample, блоки PBO), а `realized_balance` і `unrealized_pnl`
      лишаються в звіті окремо.

  - statement: >
      Після кожного входу SignalRobot ставить reduce-only стоп-ордер на тій самій
      відстані, від якої рахувався розмір (`STOP_PCT` або 2×ATR), тож
      `risk_per_trade` — це межа збитку, а не лише припущення для розміру.
    enforced_by: src/nautilus_lab/infrastructure/nautilus/signal_strategy.py
    test_missing_reason: >
      Потрібен інтеграційний прогін рушія Nautilus (гепи проти позиції → збиток
      ≈ risk_per_trade); у середовищі, де писалась правка, nautilus_trader не
      встановлювався. Вимикається `USE_PROTECTIVE_STOP=false`. SpreadRobot (pairs)
      стопа поки не має.

  - statement: >
      Грошова арифметика ведеться в `Decimal` із квантуванням, а не у `float`: сума
      ризику округлюється до копійок, тож двійкова похибка не накопичується в
      розрахунку позиції.
    enforced_by: src/nautilus_lab/domain/money.py
    verified_by: tests/unit/test_money.py::test_risk_amount
    note: >
      Тест стверджує точні значення (`Money(10000).risk_amount(Decimal("0.01")) ==
      Decimal("100.00")`), тому округлення справді перевірене. Чого НЕМАЄ:
      `Money.__post_init__` лише приводить вхід до `Decimal`, але `float` не
      відхиляє, тож «ніколи float» тримається на типових анотаціях, а не на
      відмові в рантаймі; тест, який це закрив би, мав би вимагати помилку на
      `float`-вході. Дотичні запобіжники на відʼємну суму й неприпустиму частку —
      tests/unit/test_money.py::test_negative_amount_is_rejected і
      tests/unit/test_money.py::test_invalid_fraction_is_rejected.

  - statement: >
      Захисний стоп (ratchet) ніколи не послаблюється: рівень рухається лише в бік
      прибутку, а відсоток захисту береться з `RiskLimits.stop_pct`, а не зі
      стратегії.
    enforced_by: src/nautilus_lab/domain/ratchet_stop.py
    verified_by: tests/unit/test_factor_research.py::test_ratchet_never_loosens_after_locking
    note: >
      Джерело відсотка закрито окремо —
      tests/unit/test_factor_research.py::test_overlay_ratchet_params_take_stop_pct_from_limits.
      Стоп, який «відпускає» після руху в прибуток, перетворює керований ризик на
      сподівання; тому ratchet типово вимкнено (`USE_RATCHET=false`) і вмикається
      лише явно, а стоп-рівень перевіряється від ціни, відомої на відкритті бару
      (tests/unit/test_factor_research.py::test_step_ratchet_checks_the_stop_known_at_bar_open).

  - statement: >
      Спрацювання circuit breaker не губиться: причина відмови, яку повертає
      `evaluate_entry` (напр. «max drawdown circuit breaker»), потрапляє в звіт
      прогону з кількістю, а не лишається рядком у логі.
    enforced_by: src/nautilus_lab/application/risk.py
    verified_by: tests/unit/test_risk_breaches.py::test_the_reasons_recorded_are_the_real_ones_from_evaluate_entry
    note: >
      До цього заблокований вхід був лише `log.warning`: завершений прогін міг
      показати `max_dd` рівно на `MAX_DRAWDOWN` і не дати жодної змоги сказати,
      ЯКИЙ запобіжник спрацював і скільки разів. Тепер `RiskBreachTally`
      накопичує `(причина, кількість)` у порядку першого спрацювання, а
      `BacktestReport.risk_breaches` і рядок `risk_breaches blocked=...` у
      `lab research` його показують. Порядок першого спрацювання не
      алфавітний навмисно — він відповідає на питання «що зламалося першим».
      Окремо закріплено сам порядок перевірок у `evaluate_entry`: денний ліміт
      перевіряється ПЕРЕД просадкою, тому при падінні і на день, і від піку
      звіт назве денний ліміт
      (tests/unit/test_risk_breaches.py::test_drawdown_is_the_reason_when_the_day_itself_is_flat
      і сусідній тест). Порожній `risk_breaches` означає «жодного входу не
      заблоковано» — це твердження, а не відсутність виміру, тому рядок не
      друкується, коли все чисто, замість `blocked=0`.
      Межа цієї правки: це звітність, а не стрімінг. Алерти `--notify` дописують
      підсумок спрацювань до повідомлення про завершення прогону, а не
      надсилаються в момент кожного спрацювання. Для бектесту, який завершується
      за секунди, потокові алерти не додають нічого; вони стануть потрібні разом
      із живим контуром, якого в лабораторії свідомо немає.

  - statement: >
      Вибір моделі волатильності не змінює типової поведінки: `VOL_MODEL=har`
      лишається єдиним значенням, за якого вже задокументовані прогони чинні, а
      `egarch`/`gjr_garch` вмикаються явно і без пакета `arch` дають «немає
      прогнозу», а не падіння прогону.
    enforced_by: src/nautilus_lab/domain/volatility.py
    verified_by: tests/unit/test_vol_forecast.py::test_har_is_the_default_and_needs_no_extra
    note: >
      Модель — це селектор (`VolModel` у `domain/volatility.py`), а не окремий
      шлях у стратегії: `build_vol_forecaster()` повертає `HarVolForecaster` або
      `ArchVolForecaster`, і `signal_strategy.py` бачить лише `update(bar, prev)`.
      Для GJR окремо закріплено, що він справді просить асиметричний член
      (`o=1`), а EGARCH — ні
      (tests/unit/test_vol_forecast.py::test_gjr_asks_for_the_asymmetry_term_and_egarch_does_not),
      бо інакше «GJR» був би симметричним GARCH під іншою назвою. Сам leverage-
      ефект перевірено на реальному фіті
      (tests/unit/test_vol_forecast.py::test_gjr_estimates_a_positive_asymmetry_term_on_a_leverage_series).

notes: >
  Статус `partial`, і причина конкретна: аварійного вимикача як механізму немає —
  є лише його заглушка. `domain/kill_switch.py` описує протокол `KillSwitch` і
  `NoOpKillSwitch`, який записує причину й активний стан, але НЕ скасовує робочі
  ордери і НЕ закриває позиції. Сама заглушка поводиться рівно так, як заявлено, і
  це перевірено (tests/unit/test_mft_modules.py::test_noop_kill_switch стверджує,
  що `trigger()` вмикає `is_active()` і зберігає текст причини), — але для живого
  режиму «скасувати все й закрити позиції» і є головна частина цього механізму, і
  її не існує, бо немає адаптера виконання. Тому компонент не можна назвати повним;
  окремо варто памʼятати, що circuit breaker у бектесті лише блокує нові входи й
  нічого не закриває сам — позицію закриває стратегія своїм `FLAT`.
  Друга прогалина — інваріант «стратегія не вирішує розмір» без тесту (див.
  `test_missing_reason` вище).
  Розходження з docs/ (перевірені в коді):
  1) `docs/06-ryzyk-metryky.md` §«Звідки береться стоп» пише, що ATR — «не класичне
     згладжування Вайлдера, а просте середнє». У коді
     `domain/atr.py::AverageTrueRange` — саме рекурсія Вайлдера
     (сід — середнє перших `n` TR, далі `ATR_t = (ATR_{t-1}(n-1) + TR_t)/n`), і це
     закріплено тестом
     `tests/unit/test_audit_fixes.py::test_atr_uses_wilders_recursion_not_a_rolling_mean`.
     Той самий застарілий рядок є в карті файлів `docs/12` (опис `atr.py`), хоча
     `docs/03` §4 каже «ATR Вайлдера», а `docs/12` нижче (опис тестів) згадує
     «рекурсію Вайлдера». Це важливо не заради термінології: від ATR залежить
     `stop_distance()`, а отже й розмір позиції, — тобто документ описує не той
     механізм, за яким рахуються гроші.
  2) `docs/06` §4 стверджує, що роботи кличуть `effective_risk_fraction` без
     `win_rate`/`reward_risk`, тому Келлі на розмір не впливає. Код передає
     накопичену статистику угод (`stats=self._trade_stats` у
     `infrastructure/nautilus/signal_strategy.py`), і підсумок той самий лише тому,
     що `USE_FRACTIONAL_KELLY` типово вимкнено: механізм описано неправильно, хоч
     висновок збігається.
  3) `docs/06` §5 пише, що HAR-RV і vol-scaling «підключені до роботів не».
     Насправді `signal_strategy.py` рахує прогноз волатильності на кожному барі й
     передає його в `resolve_risk_fraction()`, тож `USE_VOL_SCALING=true` справді
     зменшує ризик. Це opt-in-механізм, а не «не підключено».
  4) Дотепер `EGARCH` існував як модуль без жодного виклику в `src/`: функція
     `egarch_forecast_volatility()` була покрита тестом і згадана в `docs/09` як
     приклад для ручного вжитку, але жоден прогін її не бачив. Додати поряд з нею
     GJR-GARCH, як просив роудмап §3.3, означало б зробити ДРУГОГО сироту, тому
     тут обидві моделі підключені через `VOL_MODEL` і мають спільний
     `ArchVolForecaster`. Окремо варто знати: `USE_VOL_SCALING` на спредовому
     шляху (`SpreadRobot`) усе ще інертний — `SpreadRobotConfig` приймає
     `use_vol_scaling`, але жодного прогнозу в `resolve_risk_fraction()` не
     передає, тож прапорець там ні на що не впливає. Це не змінено цією правкою і
     лишається відкритим (див. docs/22 §5).
  Що документи описують правильно (перевірено, щоб не приписати зайвого):
  `risk_per_trade` як частку, яку можна втратити (`docs/02` §змінні), порядок і
  тексти причин у `evaluate_entry` (`docs/06` §3), недосяжність
  `MAX_OPEN_POSITIONS` при перевірці `>` (`docs/06` §3, п.2) і те, що
  `atr_stop_multiplier` не має змінної в `.env`.

