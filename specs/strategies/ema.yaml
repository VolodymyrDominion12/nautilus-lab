# =============================================================================
#  ema — перетин ковзних середніх (планка порівняння)
# =============================================================================
kind: strategy
name: ema
version: "1.0"
status: candidate
title: "EMA crossover: always-in-market baseline на двох експоненційних середніх"

hypothesis: >
  Напрямок ринку можна читати без жодного класифікатора режиму: якщо на
  закритому барі швидка EMA вища за повільну, попит переважає, і навпаки. Отже
  серія перетинів має давати додатне очікування, більше за комісії, які вона
  сама й породжує. Твердження спростовне: гіпотеза правильна лише тоді, коли
  середнє out-of-sample за фолдами (`--folds N`) вище за buy&hold за ті самі
  вікна. Якщо середнє OOS ≤ buy&hold або ≤ 0 — перетин EMA не є джерелом
  переваги, і робот лишається планкою, з якою порівнюють інших, а не стратегією.

edge_conditions:
  - name: crossover_survives_round_trip_fees
    description: >
      Розворот коштує два ринкові філи (закриття попередньої позиції та вхід у
      нову) і, отже, дві taker-комісії. Умова переваги: середній рух ціни за час
      утримання позиції перевищує цю сумарну комісію — інакше чим частіше робот
      розвертається, тим швидше програє.
  - name: signal_persistence_beats_whipsaw
    description: >
      Частка перетинів, після яких напрямок справді продовжується, мусить бути
      вищою за поріг, за якого очікування покриває витрати. У флеті (низький
      Kaufman ER) fast і slow EMA перетинаються десятки разів, і кожен перетин
      оплачується з капіталу.
  - name: selection_generalises_out_of_sample
    description: >
      Пара, обрана на in-sample як найкраща, на out-of-sample не має поступатися
      медіані всієї сітки. Якщо IS-переможець на OOS програє — сітка вимірює
      шум конкретного вікна, а не властивість стратегії.
  - name: always_in_market_beats_buy_and_hold
    description: >
      Робот постійно перебуває в ринку, тож бере на себе направлений ризик.
      Планка проєкту: середнє OOS за фолдами мусить бути вищим за
      `baseline buy&hold mean` за ті самі вікна — інакше утримання інструменту
      дало б більше за меншу складність.

implementation:
  domain_module: src/nautilus_lab/domain/ema_crossover.py
  strategy_class: EmaCrossover
  backtest_adapter: signal_strategy
  wired_in_backtest: true
  minimum_bars: 50
  grid_source: explicit
  signal_kind: direction

params:
  - env: FAST_EMA
    default: 10
    grid: [5, 10, 12]
    description: >
      Період швидкої EMA. Разом із SLOW_EMA він визначає, скільки сигналів
      згенерує робот: коротший період — більше перетинів, а отже більше комісій.
      Значення в сітці не перебираються незалежно: param_grid.py ітерує готові
      пари (5,20), (10,20), (10,40), (12,26) — тому grid тут це набір перших
      елементів пар, а не окрема вісь пошуку.
  - env: SLOW_EMA
    default: 20
    grid: [20, 40, 26]
    description: >
      Період повільної EMA. Мусить бути строго більшим за FAST_EMA — інакше
      конструктор кидає ValueError, тому сітка містить лише валідні пари.
      Порядок значень відповідає парам вище (20, 20, 40, 26 без повторів).
      Довший період — довший прогрів: для пари (10,40) потрібно 40 закритих
      барів, доки обидві EMA не ініціалізуються (сідується простим середнім
      перших `period` цін).
  - env: RISK_PER_TRADE
    default: 0.005
    tuned: false
    note: >
      Свідомо поза сіткою: робот повертає лише напрямок (Signal), а розмір
      позиції рахує ризик-шар (application/risk.py). Підбір ризику разом із
      сигналом підтягнув би ризик під історію — це названо антипатерном у
      docs/07 §7.
  - env: STOP_PCT
    default: 0.01
    tuned: false
    note: >
      Запасна відстань до стопа: поки ATR(14) не прогрівся, вона дорівнює
      price × STOP_PCT, далі — ATR × atr_stop_multiplier (2). Це правило
      розрахунку розміру, а не частина сигналу, тому воно не підбирається разом
      із періодами EMA.
  - env: TAKER_FEE
    default: 0.001
    tuned: false
    note: >
      Робот ставить ринкові ордери, тож платить саме taker — і на кожному
      розвороті двічі. Комісія є властивістю біржі, а не параметром стратегії:
      тут вона названа, щоб було видно планку, яку має перекрити середній рух.
      (Змінні оболонки мають пріоритет над .env, тому фактичне значення у
      конкретному прогоні береться з середовища, а не з цього типового.)

invariants:
  no_lookahead: true
  closed_bars_only: true
  decimal_not_float: true
  # Робот підключений до рушія, тож fail-closed-вимога до нього не діє.
  fail_closed_without_adapter: false

evidence:
  measured: true
  beats_buy_hold: false
  reproduce: >
    uv run lab ingest --start 2024-01-01 --symbols ETHUSDT,BTCUSDT   # каталог ETH/USDT 1h
    uv run lab research --robot ema --folds 4
    Числа фолд-таблиці — docs/05-roboty.md §4 (рядок `ema`); рядок-вердикт
    «does not beat buy&hold» друкує сам CLI.
  notes: >
    За docs/05-roboty.md §2 і §4: багатовіконний прогін з порівнянням проти
    buy&hold за той самий OOS-період не показує переваги — `ema` дає середнє
    OOS нижче за планку, а прогін на одній нарізці показував класичне
    перенавчання (найкраща пара на IS виявилась збитковою на OOS). Конкретні
    числа наводяться в docs/05, тут вони свідомо не дублюються, щоб не
    розійтися з першоджерелом. Статус candidate (а не rejected), бо гіпотеза не
    закрита: `ema` записаний у проєкті як постійна планка порівняння
    (docs/05 §2, §6), а не як ідея, від якої відмовились.

notes: >
  Це найпростіший робот лабораторії і найкорисніший baseline: його логіка —
  дві EMA на закритих барах, і він завжди в ринку (fast ≥ slow → лонг, fast <
  slow → шорт). Якщо складніша модель не обганяє його, вона не варта складності
  (docs/05 §2).
  Пастка, яку варто знати: гілка сітки для `ema` переносить у SelectedParams
  donchian_period, bb_period, bb_k, enter_trend_er і exit_trend_er без змін — і
  це не просто no-op. `_build_robot()` для RobotName.EMA повертає EmaCrossover,
  який жодної з цих величин не читає. Тому ER_PERIOD, TREND_EMA_PERIOD,
  SLOPE_LOOKBACK, DONCHIAN_PERIOD, BB_PERIOD, BB_K і USE_BAR_VPIN доходять до
  SignalRobotConfig і там ігноруються: їхня зміна в .env на `ema` не впливає.
  Мінімум барів 50 — це гілка за замовчуванням `minimum_bars()`, а не окремий
  рядок для `ema`: запас до найдовшого прогріву сітки (slow_ema = 40) становить
  лише 10 барів, тому для пари (10,40) фолд мусить бути помітно довшим за
  мінімум.
  Робот не переставляє позицію щобарно: сигнал у той самий бік, у якому вже є
  позиція, ігнорується, а розворот спершу закриває стару позицію і лише потім
  відкриває нову — звідси високий turnover і комісії, порівнянні з результатом.

references:
  - docs/05-roboty.md
  - docs/06-ryzyk-metryky.md
  - docs/07-yak-stvoryty-strategiyu.md
