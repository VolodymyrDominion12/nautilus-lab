[project]
name = "nautilus-lab"
version = "0.1.0"
description = "Research-first trading robots on NautilusTrader (paper/live fail closed)"
requires-python = ">=3.12"
dependencies = [
    "nautilus-trader>=1.231.0",
    "numpy>=2.0",
    "pandas>=2.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
ml = [
    "lightgbm>=4.0",
    "numpy>=2.0",
]
research = [
    "arch>=7.0",
    "optuna>=4.0",
    "polars>=1.0",
]
visualization = [
    "kaleido>=1.0",
    "plotly>=6.0",
    "simplejson>=3.20",
]
alerts = [
    "httpx>=0.27",
]
api = [
    "fastapi>=0.141.1",
    # api/app.py imports both directly (strategy specs, .env writes). They used to arrive
    # only transitively (optuna, pydantic-settings), so a server image without the
    # research extra could not start.
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "uvicorn>=0.53.0",
    "websockets>=17.1",
]

# Dev tools are not a feature of the package, so they are a dependency group, not an
# extra (docs/27 E-2.9): `uv sync` installs `dev` by default, `uv sync --no-dev` (the
# Docker image) leaves it out, and nobody can `pip install nautilus-lab[dev]` by mistake.
[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.14",
    "pandas-stubs>=2.2",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.11",
]

[project.scripts]
lab = "nautilus_lab.interfaces.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "integration: local engine I/O, no network",
]
filterwarnings = [
    # Raised inside nautilus_trader/backtest/engine.pyx (pd.Timestamp.utcnow) and
    # surfaced on our `engine.run()` line. Nautilus declares pandas>=2.3.3 but still
    # uses the pre-3.0 API, so this is theirs to fix; filtering only this one message
    # keeps deprecations from our own code visible.
    "ignore:Timestamp.utcnow is deprecated:DeprecationWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
# `notebooks/` holds a GENERATED artifact — `scripts/generate_research_notebook.py`
# writes it, cells and all. Linting the output of a code generator is the wrong
# target: formatting the `.ipynb` fights the generator (which emits `json.dumps`
# output, so `ruff format` can never agree with it), and the only thing lint ever
# found there was unused imports, which is a symptom rather than the problem.
# The artifact is checked instead by RUNNING it — `scripts/check_notebook.py`,
# wired into CI. That check caught real breakage lint had missed for a long time
# (stale `pnl_percent`/`fill_count`/`pbo_request`/`JournalRecord` references and a
# float passed where the domain requires `Decimal`). Lint the generator; execute
# the artifact.
extend-exclude = [".venv", "notebooks"]

[tool.ruff.lint]
# Beyond style (docs/27 E-2.9): S = bandit security checks, ASYNC = blocking calls in
# async code, DTZ = naive datetimes, PT = pytest idioms, C4/PERF = needless work,
# BLE = `except Exception` that swallows. Intentional boundaries say so with a
# `# noqa: <code>` and a reason on the same line, so every exception is reviewable.
select = [
    "E", "F", "I", "N", "UP", "B", "SIM", "ANN", "RUF",
    "S", "ASYNC", "DTZ", "PT", "C4", "PERF", "BLE",
]

[tool.ruff.lint.per-file-ignores]
# Tests: asserts are the point; fake tokens/passwords, /tmp paths, 0.0.0.0 and
# subprocess calls on fixed argv are fixtures, not secrets or attack surface.
"tests/**" = ["S101", "ANN", "S104", "S105", "S106", "S108", "S311", "S603"]
# Files the decision-log work (2026-09-25) is editing right now: their BLE001/S101/C416
# findings are left to that change instead of racing it. Remove this entry once it lands.
"src/nautilus_lab/api/paper_streamer.py" = ["BLE001", "S101"]
"src/nautilus_lab/infrastructure/decision_log_writer.py" = ["BLE001"]
"src/nautilus_lab/api/live_sessions.py" = ["C416"]
"src/nautilus_lab/api/routes/live.py" = ["BLE001", "S110"]
# specs/_validator.py — інструмент, який перевіряє УКРАЇНСЬКІ специфікації, тож
# його повідомлення й коментарі навмисно тією ж мовою, що й specs/*.yaml: людина
# читає звіт поруч зі спекою. RUF001-003 шукають «неоднозначні» символи Unicode
# (кириличні а, е, о, с, р, х, у, і схожі на латинські) — на українському тексті
# вони спрацьовують на кожному рядку. Це стосується ЛИШЕ цього файлу: код у src/
# і tests/ лишається англійською, як і був.
"specs/_validator.py" = ["RUF001", "RUF002", "RUF003"]
"src/nautilus_lab/domain/errors.py" = ["N818"]
# scripts/generate_research_notebook.py — генератор зошита, чий ВМІСТ це довгий
# український текст і код комірок, записані рядковими літералами. Тому:
#   * RUF001-003 — той самий випадок, що й у specs/_validator.py: легітимний
#     український текст, а не «неоднозначні» символи, які правило шукає в коді;
#   * E501 — довгі рядки тут це проза та код комірок усередині рядків, а не
#     логіка. Поріг у 100 символів адресований коду; ламати ним речення
#     природної мови означало б змінювати текст, який потрапляє в зошит.
# Решта правил (F, I, N, UP, B, SIM, ANN, E402) до цього файлу застосовується
# повністю — сам код генератора лишається перевіреним.
"scripts/generate_research_notebook.py" = ["RUF001", "RUF002", "RUF003", "E501"]
# scripts/gen_status.py — генератор docs/STATUS.md, українською, як і сама таблиця:
# RUF001-003 спрацьовують на кожному рядку тексту, а не на коді.
"scripts/gen_status.py" = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["nautilus_lab"]
pretty = true

[[tool.mypy.overrides]]
module = ["nautilus_trader.*"]
ignore_missing_imports = true

# PyArrow постачається без type stubs, але є жорсткою залежністю nautilus_trader
# (`pyarrow>=25.0.0`), тож він присутній завжди — на відміну від polars, який живе
# лише в extra `research`. Тому сховище серії фандингу пише Parquet через pyarrow:
# це єдиний колонковий рушій, доступний базовій інсталяції без extras.
[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

# PyYAML постачається без type stubs, а тягнути types-PyYAML як залежність
# заради одного імпорту в тестах специфікацій не варто — тим самим способом,
# яким тут уже вирішено для nautilus_trader.
[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/nautilus_lab"]
branch = true
# No `omit`: backtest_runner.py, signal_strategy.py and instrument.py used to be left
# out, and they are exactly where every P0 of the 2026-09-23 audit lived (docs/27 E-1.9).
# The integration tests (tests/integration/) run them through the real engine, so the
# number now describes the engine adapters too, not only the code around them.

[tool.coverage.report]
# The measured TOTAL, rounded down - never a round number picked from above. Re-measure
# with `uv run pytest --cov` after a change to what is measured, and only raise it.
fail_under = 80
show_missing = true
