# =============================================================================
#  vpin_momentum — робот на токсичності потоку (VPIN) + моментумі
#  Структура й тон — за еталоном specs/strategies/regime.yaml.
# =============================================================================
kind: strategy
name: vpin_momentum
version: "1.1"
status: candidate
title: "VPIN momentum: момент у бік токсичного потоку, трейлінг-стоп за ATR"

hypothesis: >
  VPIN (`domain/vpin.py::BarVpin`) міряє дисбаланс ініційованих обсягів:
  |buy − sell| / total усередині кошика рівного обсягу. Куплений тейкерами обсяг
  береться зі справжнього поля 9 klines (`takerBuyBaseAssetVolume`), а tick-rule
  (close проти close попереднього бару) лишається фолбеком лише там, де поле
  невідоме — у синтетиці та в серіях, залитих до Фази 4
  (`OhlcvBar.taker_buy_base_volume is None`). Якщо останній завершений кошик
  «токсичний» (VPIN ≥ VPIN_TOXIC_THRESHOLD),
  на ринку, за цією гіпотезою, працює інформований гравець, і рух має
  продовжитися, а не розвернутися. Тоді вхід у бік ціни відносно EMA
  (`vpin_momentum_ema_period`): ціна вище EMA — лонг, нижче — шорт; вихід — на
  втраті EMA або по трейлінг-стопу `ATR_MULTIPLE × ATR(14)` з мінімальним
  утриманням 3 бари. Гіпотеза дає додатну дохідність OOS після комісій, вищу за
  просте утримання інструменту (buy&hold) за той самий період. Гіпотеза
  сфальсифікована, якщо OOS-агрегат не перевищує buy&hold на тому ж вікні.

edge_conditions:
  - name: bucket_fills_within_a_usable_window
    description: >
      Кошик рівного обсягу мусить наповнюватися за ~10–50 барів. VPIN рахується
      лише на завершених кошиках, і `BarVpin.update()` повертає останній
      завершений стан (він не скидається між барами), тож завеликий
      `VPIN_BUCKET_VOLUME` «заморожує» ознаку токсичності, і робот входить за
      застарілим сигналом (попередження — docs/09-mft-moduli-pryklady.md §1).
  - name: sign_comes_from_real_taker_flow
    description: >
      Дисбаланс кошика рахується на справжньому обсязі тейкерів (поле 9 klines,
      `takerBuyBaseAssetVolume`), а не на проксі tick-rule, завжди коли серія
      потоку існує в каталозі. Вимірюване: на тій самій серії барів
      розподіл VPIN зі справжнього потоку відрізняється від tick-rule-проксі, а
      частка барів із `taker_buy_base_volume == volume` (бар, де весь обсяг
      агресивно куплений) не нульова. Проксі вмикається рівно там, де поле
      невідоме, і це видно явно: `OhlcvBar.taker_buy_base_volume is None`.
  - name: toxic_flow_precedes_continuation_not_reversal
    description: >
      Після токсичного кошика (VPIN ≥ порогу) наступні бари продовжують рух у бік
      EMA-сторони входу. Це вимірюване: частка входів, де рух у бік сигналу
      перевищує рух проти нього на горизонті утримання, мусить бути > 0.5.
  - name: continuation_covers_round_trip_costs
    description: >
      Середній рух після входу перекриває round-trip витрати (taker-комісія за
      вхід і вихід ринковими ордерами + сліппедж). Вимірюване: середній PnL на
      угоду після комісій > 0, а не «брутто в плюсі, нетто в мінусі».
  - name: atr_stop_bounds_the_loss_per_trade
    description: >
      Трейлінг-стоп `ATR_MULTIPLE × ATR(14)` і вихід на втраті EMA обмежують
      збиток на угоду, а розмір позиції нормується `RISK_PER_TRADE` у адаптері,
      тож умова «частка прибуткових угод × середній виграш > частка збиткових ×
      середній збиток» виконується після комісій. Мінімальне утримання 3 бари
      при цьому гасить смикання на самій межі EMA.

implementation:
  domain_module: src/nautilus_lab/domain/vpin_momentum.py
  strategy_class: VpinMomentum
  backtest_adapter: signal_strategy
  wired_in_backtest: true
  minimum_bars: 150
  grid_source: explicit
  signal_kind: direction

params:
  - env: VPIN_MOMENTUM_EMA_PERIOD
    default: 50
    grid: [30, 50, 80]
    description: >
      Вікно EMA, що задає бік входу: ціна вище EMA — лонг, нижче — шорт. Це
      єдиний параметр, який перебирає сітка робота (`param_grid.py`, гілка
      `RobotName.VPIN_MOMENTUM`); Optuna додатково шукає його в [20, 100] з кроком
      10 (`optuna_optimizer.py`).
  - env: VPIN_MOMENTUM_ATR_MULTIPLE
    default: 2
    tuned: false
    note: >
      Множник ATR для трейлінг-стопу. Свідомо поза сіткою `param_grid.py`: її
      гілка для `vpin_momentum` переносить значення без перебору. Перебирає його
      лише Optuna — `vpin_atr_multiple ∈ [1.0, 4.0]`, крок 0.5
      (`optuna_optimizer.py`), і це окремий, не сітковий шлях підбору.
  - env: VPIN_BUCKET_VOLUME
    default: 1000
    tuned: false
    note: >
      Обсяг одного VPIN-кошика в одиницях базової валюти. Не підбирається в жодній
      сітці й не має «правильного» значення: він залежить від інструменту й
      таймфрейму. docs/08-mft-2026-vidpovidnist.md §1.2 прямо попереджає, що для
      ETH типовий обсяг годинного бару — сотні ETH, тож 1000 може бути завеликим.
      Підбір цього порогу на IS перетворив би саму ознаку токсичності на параметр
      підгонки, тому він лишається ручним рішенням дослідника.
  - env: VPIN_TOXIC_THRESHOLD
    default: 0.7
    tuned: false
    note: >
      Поріг, за яким кошик вважається токсичним. Поза сіткою свідомо: це
      визначення поняття «токсично», а не джерело переваги — як `ENTER_TREND_ER` у
      робота `regime`. Оптимізація порогу тихо підганяла б класифікатор під
      історію, тому поріг фіксований, а перевіряється чутливість, а не «найкраще»
      значення. Після Фази 4 відомо, що на ETH/USDT 1h цей поріг **не досягається
      жодного разу**: максимум справжнього VPIN за 23 808 кошиків — 0.694. Тому
      робот стоїть осторонь (див. `evidence.notes`), і саме тому поріг не можна
      рухати «щоб заторгувало»: це була б підгонка під уже побачений OOS.

invariants:
  no_lookahead: true
  closed_bars_only: true
  decimal_not_float: true
  # Робот підключений до рушія, тож fail-closed-вимога до нього не діє
  # (`require_backtest_support()` його пропускає).
  fail_closed_without_adapter: false

evidence:
  measured: true
  beats_buy_hold: false
  reproduce: >
    uv run lab ingest --start 2024-01-01 --end 2026-09-19 --symbols ETHUSDT   # бари + серія потоку
    uv run lab research --robot vpin_momentum --folds 4                       # зі справжнім потоком
    mv catalog/data/taker_flow /tmp/taker_flow && uv run lab research --robot vpin_momentum --folds 4
    mv /tmp/taker_flow catalog/data/taker_flow                                # той самий прогін на проксі
    Друга й третя команди — контрольоване A/B на одній і тій самій бар-серії.
  notes: >
    Вимір є, і він негативний — але тепер із розділенням причин. На ETH/USDT 1h
    (2024-01-01…2026-09-18, 23 808 барів, 4 ковзні фолди, виміряно 2026-09-21):
    зі справжнім потоком тейкерів `oos_fills=0` і OOS mean 0.00% — робот не торгує
    взагалі; на tick-rule-проксі тієї самої серії `oos_fills=398`, OOS mean −5.44%,
    median −5.50%, worst −6.55%, best −4.22%, тоді як `baseline buy&hold mean=+1.67%`
    — тобто вердикт `does not beat buy&hold` в обох випадках, але з різних причин.
    Причина різниці вимірювана: медіанний VPIN на справжньому потоці — 0.087
    (p90 0.222, максимум 0.694), а на проксі — 1.0, і поріг `VPIN_TOXIC_THRESHOLD=0.7`
    на реальних даних не досягається жодного разу. Проксі тримав фільтр увімкненим
    у 99.9% кошиків, тобто фільтром він не був.
    Що це означає для статусу. `candidate` («не доведено») лишається правильною
    оцінкою, бо незакритими лишаються незалежні змінні: поріг токсичності, розмір
    кошика, символ і таймфрейм. Але змінилась сама гіпотеза, яку треба перевіряти:
    питання більше не «чи дає момент після токсичного кошика перевагу», а «чи існує
    на годинному таймфреймі рівень дисбалансу тейкерів, який узагалі можна назвати
    токсичним» — максимум 0.694 з 23 808 кошиків каже, що на цьому таймфреймі ознака
    майже не має динамічного діапазону. Зниження порогу тут — окрема гіпотеза з
    підбором ЛИШЕ на IS, і воно не робиться заднім числом під уже побачений OOS.
    Числа виміру продубльовані в docs/23 §6 і docs/08 §1.2 свідомо: це той випадок,
    коли результат змінює сенс гіпотези, і загубити його в .gitignore-лозі не можна.
    Попередній вимір на проксі (0/4 фолдів, `reports/ai-2026-comparison.md`, сирі
    логи `reports/wf-vpin-folds4.txt` і `reports/wf-all.log`) лишається історією того,
    як виглядав артефакт, а не поточним станом коду.

notes: >
  Що саме міряє VPIN тут — і чого він НЕ міряє. `BarVpin` працює на барах OHLCV,
  а не на стрічці угод: обсяг бару ділиться на кошики рівного обсягу, а частка
  buy/sell береться зі справжнього поля 9 klines — `takerBuyBaseAssetVolume`
  (Фаза 4 з docs/23-infrastruktura-danyh-plan.md) — і розподіляється по кошиках
  пропорційно (`BarVpin._fill_split`), бо порядок угод усередині бару не
  спостережуваний. Наливати «спершу buy, потім sell» не можна: коли бар ширший за
  кошик (ETH 1h: медіана 12 644 ETH проти кошика 1000), це фабрикує однобічний
  кошик на кожному барі й піднімає медіану VPIN збалансованого потоку з 0.087 до
  1.0 — виміряно, і саме тому регресію закріплено тестом.
  Наближенням лишається роздільна здатність, а не знак: усередині бару не видно ні
  порядку угод, ні їхніх міток часу, тож кошик наповнюється цілим баром, а не
  окремими угодами; книги ордерів немає взагалі (docs/08 §1.2). Коли поле невідоме
  (синтетика або серія, залита до Фази 4), `_price_rule_is_buy` падає на tick-rule:
  close > close попереднього бару — «купівля», менше — «продаж», рівно — купівля.
  Чого VPIN не розрізняє за побудовою: значення `|buy − sell| / total` не має знака,
  тож справжній потік змінює не напрямок ознаки, а її масштаб — «наскільки бар
  змішаний». Напрямок входу, як і раніше, задає бік ціни відносно EMA.
  Провенанс поля. Nautilus `Bar` не має колонки під taker-обсяг, тож поле не
  проходить round-trip через рушій: `lab ingest` пише його окремою серією
  `<catalog>/data/taker_flow/<SYMBOL>/taker_flow.parquet` (ключ — той самий час
  бару, `Decimal` зберігається рядком), `ResearchBarFeed` підмішує його назад у
  `OhlcvBar` за міткою часу, а `NautilusResearchBacktest` передає таблицю
  `{nanos: taker_buy}` у стратегію
  (`SignalRobot(..., taker_buy_base_volume_by_ns=...)`). Джойн точний, бо і ключ,
  і `Bar.ts_event` — це `datetime_to_nanos(ts_utc)`; збій джойну лишає поле
  `None` (фолбек), а не вигадане число, а порушення `taker <= volume`
  ловить `validate_bar`. Каталог без серії потоку працює як раніше, а
  `lab ingest --incremental` на такому каталозі робить разовий backfill серії
  замість тихого пропуску.
  Модуль
  `domain/microstructure.py` (OBI/WOFI/liquidity fade) до цього робота не
  підключений — він працює на знімках книги, яких у бектесті немає.
  VPIN-фільтр тут увімкнений завжди, і окремого перемикача в робота немає:
  `VpinMomentum` сам створює `BarVpin` у конструкторі. `USE_BAR_VPIN` (типово
  `false`) читається ЛИШЕ в гілці робота `regime`, де він передає `vpin` у
  `RegimeRouter` (`infrastructure/nautilus/signal_strategy.py::_build_robot`).
  Тому в `params` цього поля немає: воно існує в `Settings`, але на
  `vpin_momentum` не впливає — писати його в спеку означало б обіцяти перемикач,
  якого робот не має.
  Поза `Settings` лишились `atr_period = 14` і `min_hold_bars = 3`: адаптер
  `_build_robot()` їх не передає, тож діють значення за замовчуванням
  конструктора. Вони не є `params`, бо їх немає чим задати з `.env`.
  Вимір тут живе не в docs/: у docs/05-roboty.md досі немає розділу про
  `vpin_momentum` (і сама таблиця стану в docs/05 §0 перелічує лише три
  підключені роботи, хоча в коді їх п'ять) — це документована розбіжність
  (див. `.agents/skills/nautilus-lab/SKILL.md` §«Розходження»). Єдине
  виміряне джерело — `reports/`.

