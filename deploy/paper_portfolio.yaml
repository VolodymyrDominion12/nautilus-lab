# Live paper sessions this server runs (LIVE_PAPER_PORTFOLIO=deploy/paper_portfolio.yaml).
#
# Read on every API start and reconciled by `name`:
#   * a name that is running        -> left alone (changed parameters are reported in the
#                                      log, not applied: new parameters = a new name);
#   * a name a person stopped (Stop) -> NOT restarted; rename it to run it again;
#   * a name never seen              -> started.
# Removing an entry does not stop a running session; stop it in the dashboard.
#
# `.env` supplies what every session shares: fees, RISK_PER_TRADE/STOP_PCT defaults, the
# breakers, ER/TREND periods and the BB channel. Anything under `regime:`, `adaptive:`,
# `legs:`, `fast_ema`, `slow_ema`, `ema_min_spread_pct` overrides that **for one session**,
# which is what makes several variants of one robot runnable at once (docs/26 §5a).
# Robots available live: regime, ema, adaptive_ema, vpin_momentum, formulaic_lgbm, hold.
# `hold` is the buy-and-hold benchmark: every other session on the same symbol and interval
# is compared with it (vs_benchmark_pp in the dashboard and the report).
#
# READ THIS BEFORE DRAWING A CONCLUSION FROM THE JOURNALS
# All four leaders come from backtests that ended in **REJECT**. The two 4h cells fail
# exactly one gate check — `beats_vol_matched` (their return does not beat a buy & hold
# with the same volatility) — with promotion_gate=REJECT, and PBO/DSR were not measured.
# The two 1h entries have only `--folds 2` and lost to plain buy & hold by ~25pp. So the
# paper run here is a *rehearsal of a specific configuration against the same market*, not
# a validation: the number to report is the "vs hold" column after enough weeks, and even
# a positive one does not turn a REJECT into an edge (AGENTS.md rules 2 and 4).

defaults:
  # The backtests these rehearse used 100 000, so the paper account starts there too: a
  # different account would size positions differently and produce incomparable numbers.
  starting_equity: 100000
  risk_per_trade: 0.005
  stop_pct: 0.03
  take_profit_multiple: 2

sessions:
  # --- 1h: top of research/leaderboard.jsonl (2 folds only) ---------------------------
  - name: lead-regime-eth
    robot: regime
    symbol: ETHUSDT
    interval: 1h
    # DONCHIAN/BB as the leaderboard run selected them; legs untouched (all three).
    regime:
      donchian_period: 120
      bb_period: 120
      bb_k: 3
    notes: >-
      lb_20261008_054535_regime (ETHUSDT 1h, folds 2): OOS +10.2%, buy & hold +34.6%,
      excess -24.5%, 188 fills. Reproduce: BB_K=3 BB_PERIOD=120 DONCHIAN_PERIOD=120
      uv run lab research --robot regime --instrument ETH/USDT.SIM --interval 1h --folds 2.

  - name: lead-ema-eth
    robot: ema
    symbol: ETHUSDT
    interval: 1h
    fast_ema: 10
    slow_ema: 40
    ema_min_spread_pct: 0.003
    notes: >-
      lb_20261008_055108_ema (ETHUSDT 1h, folds 2): OOS +9.6%, buy & hold +34.6%,
      excess -25.1%, 546 fills. Reproduce: EMA_MIN_SPREAD_PCT=0.003 FAST_EMA=10 SLOW_EMA=40
      uv run lab research --robot ema --instrument ETH/USDT.SIM --interval 1h --folds 2.

  - name: hold-eth
    robot: hold
    symbol: ETHUSDT
    interval: 1h
    notes: Benchmark for every ETHUSDT 1h session (buy & hold from the same start).

  # --- 4h: top cells of batch 20261019_182839_p1_regime_4h_ensemble (12 folds) --------
  # Both cells: regime with REGIME_LEGS=uptrend,downtrend, PARAM_SEARCH=false, spot 4h,
  # days 2200, is_fraction 0.5, embargo 10. Range leg switched off by the batch, so a live
  # session without `legs:` would take entries the backtest never took.
  - name: lead-sol-4h
    robot: regime
    symbol: SOLUSDT
    interval: 4h
    legs: uptrend,downtrend
    regime:
      donchian_period: 40
    notes: >-
      regime_SOL__E40 (12 folds): mean OOS +2.48%/fold, median +0.84%, worst -2.33%,
      profitable 7/12; buy & hold +35.76%/fold, vol-matched buy & hold +5.84%.
      promotion_gate=REJECT (the only failing check is beats_vol_matched; PBO/DSR not
      measured). Catalog catalog_spot_4h, days 2200, folds 12, is_fraction 0.5.

  - name: hold-sol-4h
    robot: hold
    symbol: SOLUSDT
    interval: 4h
    notes: Benchmark for SOLUSDT 4h (plain and vol-matched buy & hold - read both).

  - name: lead-ada-4h
    robot: regime
    symbol: ADAUSDT
    interval: 4h
    legs: uptrend,downtrend
    regime:
      donchian_period: 40
    notes: >-
      regime_ADA__E40 (12 folds): mean OOS +2.47%/fold, median +1.17%, worst -3.39%,
      profitable 7/12; buy & hold +17.12%/fold, vol-matched buy & hold +3.28%.
      promotion_gate=REJECT (only beats_vol_matched fails; PBO/DSR not measured).

  - name: hold-ada-4h
    robot: hold
    symbol: ADAUSDT
    interval: 4h
    notes: Benchmark for ADAUSDT 4h.
