# =============================================================================
#  adaptive_ema — «селективне» згладжування: скалярна форма ідеї Mamba
# =============================================================================
#  Джерело ідеї — «Трансформери проти SSM у трейдингу.md» §2.2 і §8.2: у Mamba
#  крок дискретизації Δ і матриці B, C залежать від входу (селективність), а не
#  є сталими, як у S4. У скалярному випадку ця рекурентність — звичайне EMA
#  (`h_t = (1−α)h_{t-1} + α x_t`, тобто вже наявний `domain/ema.py`), тож
#  «селективність» тут має один вимірюваний зміст: α_t залежить від стану ринку
#  (efficiency ratio Кауфмана), а не від константи.
#
#  Це свідомо НАЙДЕШЕВША форма ідеї: без torch, без GPU, на Decimal, у тому ж
#  домені, де вже живе `regime`. Усе інше в роботі (Donchian-пробої, BB-повернення
#  до середнього, ризик-шар, комісії) узяте з `regime` без змін — щоб єдиною
#  змінною експерименту був фільтр режиму.
# =============================================================================
kind: strategy
name: adaptive_ema
version: "1.0"
status: candidate
title: "Adaptive EMA: фільтр режиму на EMA з α, що залежить від efficiency ratio"

hypothesis: >
  Якщо фільтр режиму замінити на EMA зі змінним кроком — α_t = α_base ·
  (1 + selectivity · (2·ER_t − 1)), де ER_t — efficiency ratio Кауфмана на
  закритих барах, — то в шумі (ER низький) фільтр гладить сильніше, а на
  структурному русі (ER високий) реагує швидше. Гіпотеза: такий «селективний»
  фільтр дає кращий OOS-результат, ніж той самий робот зі сталим α (`regime` за
  тих самих параметрів), бо він не платить зайвими розворотами за шум і не
  запізнюється на тренді. Гіпотеза сфальсифікована, якщо OOS-агрегат
  `--folds N≥2` не перевищує ані `regime`/`ema` за той самий період, ані
  buy&hold, АБО якщо selectivity=0 (контрольна конфігурація, тотожна сталому α)
  дає статистично не гірший результат за selectivity>0. Тоді адаптивність нічого
  не додає до фіксованого фільтра, і правильна відповідь — `rejected`.

edge_conditions:
  - name: selectivity_beats_its_own_control
    description: >
      Конфігурація з selectivity > 0 обганяє конфігурацію selectivity = 0 на тому
      самому OOS-вікні. Це головна перевірка: selectivity=0 — це буквально
      фіксоване α (той самий робот, та сама сітка), тому будь-яка перевага
      адаптивності мусить бути видимою саме тут. Якщо різниці немає, «селективність»
      у скалярному випадку не існує як явище.
  - name: alpha_actually_moves
    description: >
      Адаптивний α справді змінюється з ER, а не залишається константою через
      помилку: min(α_t) < max(α_t) на реальних барах, і при selectivity=0 вибірка
      α_t тотожно дорівнює сталій α базового EMA. Друга частина — це перевірка
      контролю: вона доводить, що базова конфігурація сітки є чесним нулем.
  - name: filter_does_not_add_turnover
    description: >
      Адаптивність не купує результат частотою: кількість філів і `turnover`
      лишаються співмірними з `regime` (не в рази більшими). Інакше виграш, якщо
      він з'явиться, оплачений комісіями — і це видно в `breakeven_cost_bps`
      поруч із `paid_cost_bps`.
  - name: oos_beats_buy_and_hold
    description: >
      OOS-агрегат (`--folds 4`) обганяє buy&hold за той самий період. Планка
      проєкту: плюсове число без цього порівняння не є перевагою.

implementation:
  domain_module: src/nautilus_lab/domain/adaptive_ema.py
  strategy_class: AdaptiveEmaRouter
  backtest_adapter: signal_strategy
  wired_in_backtest: true
  minimum_bars: 150
  grid_source: explicit
  signal_kind: regime

params:
  - env: ADAPTIVE_PERIOD
    default: 40
    grid: [10, 20, 40]
    description: >
      Базовий період EMA: α_base = 2/(period+1). Це та сама роль, що
      TREND_EMA_PERIOD у `regime`.
  - env: ADAPTIVE_SELECTIVITY
    default: 0.5
    grid: [0, 0.5, 1]
    description: >
      Сила селективності в [0, 1]: 0 = сталий α (контроль, тотожний `regime` за
      тих самих параметрів), 1 = максимальний розмах α у межах [α_base/2, 3α_base/2]
      (з відсіканням у (0, 1)).
  - env: ADAPTIVE_ER_PERIOD
    default: 20
    tuned: false
    note: >
      Вікно efficiency ratio для стану фільтра. Не входить у сітку: це не «крутилка
      прибутковості», а визначення самого стану, і перебір ще однієї осі лише
      додав би спроб у DSR без нової гіпотези.
  - env: ADAPTIVE_SLOPE_LOOKBACK
    default: 10
    tuned: false
    note: >
      Вікно нахилу адаптивної EMA. Фіксоване з тієї ж причини, що й вище.

invariants:
  no_lookahead: true
  closed_bars_only: true
  decimal_not_float: true
  fail_closed_without_adapter: true

notes: >
  Порівняння, яке має сенс: `--robot adaptive_ema --folds 4` проти
  `--robot regime --folds 4` і проти `--robot ema --folds 4` на тому самому
  каталозі (той самий OOS-період), плюс buy&hold, який CLI друкує сам.

  Чому selectivity=0 у сітці, а не «просто перевіримо на око»: сітка з трьома
  значеннями selectivity містить власну нульову гіпотезу. Якщо переможцем
  виявиться selectivity=0, це прямо означає, що адаптивність не потрібна — і
  тоді робота треба закривати як `rejected`, а не «підкручувати».
